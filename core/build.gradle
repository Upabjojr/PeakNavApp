[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

// Build-time data tools. Their own source set on purpose: they are run from a developer's
// machine to prepare data that ships as assets, and none of their code belongs in the app -
// keeping them here means the index-writing half of Lucene never reaches the APK.
sourceSets {
    tools
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    if(enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    }

    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    // Guava was here for exactly two CacheBuilder caches, one of which was dead code. It cannot
    // run on iOS at all - RoboVM's runtime has no java.util.function package, and Guava's
    // Equivalence implements BiPredicate, so building a cache threw NoClassDefFoundError before
    // the first frame. Replaced by com.peaknav.utils.LruCache; see the note there.

    implementation 'com.google.code.gson:gson:2.14.0'
    /*implementation(group: 'com.graphhopper', name: 'graphhopper-core', version: '1.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'org.openstreetmap.osmosis', module: 'osmosis-osm-binary'
        exclude group: 'org.apache.xmlgraphics', module: 'xmlgraphics-commons'
    }*/
    // implementation 'org.jgrapht:jgrapht-core:1.3.1'
    implementation 'org.openstreetmap.pbf:osmpbf:1.6.1'
    // implementation 'com.github.davidmoten:geo:0.8.0'

    implementation 'org.mapsforge:mapsforge-core:0.17.0'
    implementation 'org.mapsforge:mapsforge-map:0.17.0'
    implementation 'org.mapsforge:mapsforge-map-reader:0.17.0'
    implementation 'org.mapsforge:mapsforge-themes:0.17.0'

    // implementation 'de.westnordost:osmapi-overpass:2.0'

    // implementation "com.alexdupre:pngj:2.1.2.1"

    implementation 'com.ibm.icu:icu4j:74.2'

    /*
    implementation 'org.apache.lucene:lucene-core:9.9.0'
    implementation 'org.apache.lucene:lucene-analysis-common:9.9.0'
    implementation 'org.apache.lucene:lucene-queryparser:9.9.0'
    */

    // NEWER VERSIONS NOT COMPATIBLE WITH ANDROID!!!!!
    implementation 'org.apache.lucene:lucene-core:3.6.2'
    implementation 'org.apache.lucene:lucene-analyzers:3.6.2'
    implementation 'org.apache.lucene:lucene-queryparser:3.6.2'

    // commons-compress was here to unpack the downloaded .tar.gz archives, and it is the one
    // dependency that could not be made to work on iOS at all - three separate failures, each
    // only visible once the previous was fixed (see com.peaknav.utils.TarReader). The app
    // needed gzip, which java.util.zip provides everywhere including RoboVM, and a tar reader,
    // which is now TarReader - verified against a real dataset archive, byte for byte.

    // compile 'org.openpnp:opencv:4.5.5-1'

    // Build-time tools (see the tools source set above). Same pinned Lucene as the app, so an
    // index built here is one the app can open.
    toolsImplementation 'org.apache.lucene:lucene-core:3.6.2'
    toolsImplementation 'org.apache.lucene:lucene-analyzers:3.6.2'
    // The skyline benchmark runs the app's own matcher (com.peaknav.skyline) over a photo
    // dataset, so the tools see the shared code; gson reads the dataset manifest.
    toolsImplementation sourceSets.main.output
    toolsImplementation 'com.google.code.gson:gson:2.14.0'

    // Test dependencies :
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.8.2"
    // Gradle 9 needs the launcher on the test runtime classpath explicitly, as :headless does.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // testImplementation "org.mockito:mockito-core:3.10.0"
    // The tests cover the tools too: they build a small index and search it.
    testImplementation sourceSets.tools.output

}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Gradle's 512 MB default is not enough for TestSkylineDataset, which decodes whole
    // 4096x4096 elevation tiles (32 MB each, a handful cached) for the terrain horizon.
    maxHeapSize = '2g'
}

/**
 * Rebuilds the place-search index the app ships in assets/geonames_index.362/.
 *
 * Needs cities500.txt and alternateNamesV2.txt from https://download.geonames.org/export/dump/:
 *
 *   ./gradlew :core:buildGeonamesIndex \
 *       --args="cities500.txt alternateNamesV2.txt assets/geonames_index.362"
 *
 * With no arguments it reads those two names from the working directory and writes
 * geonames_index.362 beside them. Lucene is pinned to 3.6.2, the last Android-compatible
 * release, so do not bump it here without bumping it for the app.
 */
/*
 * Runs the photo skyline matcher over a dataset of geotagged mountain photographs with a
 * known camera heading (built by tools/skyline_dataset.py) and reports how often, and how
 * confidently, it recovers the bearing:
 *
 *   ./gradlew :core:skylineBenchmark --args="~/.peaknav/skyline_dataset/geopose3k/manifest.json"
 *
 * Needs the elevation tiles of the photographed areas in ~/.peaknav (the app's own cache)
 * or in the peaknav Python package's cache.
 */
tasks.register('skylineBenchmark', JavaExec) {
    group = 'peaknav'
    description = 'Benchmarks the photo skyline matcher over a geotagged photo dataset.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.peaknav.tools.SkylineBenchmark'
    maxHeapSize = '3g'   // a horizon touches up to nine 4096x4096 elevation tiles
    // -Dpeaknav.skyline.classifier=false compares against the colour-model fallback
    systemProperties System.properties.findAll { it.key.toString().startsWith('peaknav.') }
    workingDir = rootProject.projectDir
}

/**
 * Writes the sky/ground training rows for tools/skyline_train.py from a dataset manifest
 * with full camera poses (GeoPose3K), or checks an exported model against the trainer:
 *
 *   ./gradlew :core:skylineTrainingDump --args="manifest.json rows.csv.gz"
 *   ./gradlew :core:skylineTrainingDump --args="--check sky_model.bin check.csv"
 */
tasks.register('skylineTrainingDump', JavaExec) {
    group = 'peaknav'
    description = 'Dumps per-pixel sky/ground training rows for the skyline classifier.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.peaknav.tools.SkylineTrainingDump'
    maxHeapSize = '3g'
    workingDir = rootProject.projectDir
}

/**
 * Scores the skyline extractor alone against hand-traced skylines (Ahmad et al.'s CH1,
 * Basalt and Web sets): ./gradlew :core:skylineMaskEval --args="[--annotate DIR] dataset/CH1/cvg ..."
 */
tasks.register('skylineMaskEval', JavaExec) {
    group = 'peaknav'
    description = 'Scores the skyline extractor against hand-traced skylines.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.peaknav.tools.SkylineMaskEval'
    maxHeapSize = '2g'
    workingDir = rootProject.projectDir
    systemProperties System.properties.findAll { it.key.toString().startsWith('peaknav.') }
}

tasks.register('buildGeonamesIndex', JavaExec) {
    group = 'peaknav'
    description = 'Builds the GeoNames place-search index from the GeoNames dumps.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.peaknav.tools.GeonamesIndexBuilder'
    // Relative paths in --args resolve against the repository root, as every example in
    // the README writes them. JavaExec's default is this subproject's directory, which
    // silently created core/geonames_index.362 and core/assets/... instead of touching
    // the real index - "the build ran fine" with the output somewhere nobody looks.
    workingDir = rootProject.projectDir
}

/*
 * Adds OSM mountain peaks to an already-built index, in place:
 *
 *   ./gradlew :core:addPeaksToIndex --args="peaks.tsv assets/geonames_index.362 [minEle]"
 *
 * peaks.tsv comes from extracting natural=peak nodes out of .osm.pbf files; minEle drops
 * peaks below that elevation unless they have a Wikipedia article. Appending needs only
 * the shipped index, not the GeoNames dumps a full rebuild would ask for.
 */
tasks.register('addPeaksToIndex', JavaExec) {
    group = 'peaknav'
    description = 'Appends mountain peaks (from an OSM extraction) to the search index.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.peaknav.tools.PeakIndexAppender'
    workingDir = rootProject.projectDir   // see buildGeonamesIndex
}

