
buildscript {
    repositories {
        mavenCentral()
        google()
    }
}
apply plugin: 'com.android.application'


android {
    namespace "com.peaknav"
    // 36 is required by androidx.core 1.17.0, which gdx-backend-android 1.14.2 pulls in.
    // Raising compileSdk only affects which APIs can be compiled against; minSdk is deliberately
    // left alone so the app still installs on Android 5.
    compileSdk 36
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs(['src/main/java'])
            aidl.setSrcDirs(['src/main/java'])
            renderscript.setSrcDirs(['src/main/java'])
            res.setSrcDirs(['res'])
            assets.setSrcDirs(['../assets'])
            jniLibs.setSrcDirs(['libs'])
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                         'META-INF/dependencies.txt', '**/*.gwt.xml']
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                           'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
        }
    }
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.peaknav'
        minSdkVersion 21
        // Google Play requires the target to stay within a year of the newest Android release:
        // from 31 Aug 2026 an app targeting below 36 (Android 16) can no longer be updated.
        //
        // Raising this also opts the app in to Android 16's runtime behaviour. Three changes could
        // have reached this app and none of them does: edge-to-edge is enforced without the old
        // opt-out, which this app never set (it is fullscreen anyway, see GdxTheme and the
        // activity's Theme.NoTitleBar.Fullscreen); orientation restrictions are ignored on large
        // screens, and the activity asks for fullSensor, so it restricts nothing; and predictive
        // back is on by default, which only animates the ordinary finish here since the back key
        // is left to the system (MapViewerScreen calls setCatchKey(BACK, false)) and nothing
        // overrides onBackPressed.
        targetSdkVersion 36
        versionCode 151
        // Kept in step with `projectVersion` in gradle.properties, which is what the
        // desktop installers are named after; versionCode stays the Play upload
        // counter and is bumped by hand per upload.
        versionName "1.2.0"
    }
    compileOptions {
        sourceCompatibility "8"
        targetCompatibility "8"
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release {
            debuggable false
            // R8, which Play Console asks for. The default file is the -optimize variant:
            // plain proguard-android.txt turns optimisation off, which would leave the build
            // doing the shrinking half of the job Play is asking about.
            //
            // Resource shrinking is deliberately not enabled alongside it. The app's resources
            // are a handful of layouts and icons, so there is nothing to win there, while the
            // assets folder - which is where the size actually is - is not touched by it.
            //
            // See proguard-rules.pro for what has to be kept, and note android.enableR8.fullMode
            // is already false in gradle.properties, so keep rules retain their ProGuard meaning.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "drawable", "ic_launcher_app", "@mipmap/ic_launcher"
            resValue "string", "app_name", "@string/app_name_releaseBundle"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            resValue "drawable", "ic_launcher_app", "@drawable/ic_launcher_debug"
            resValue "string", "app_name", "@string/app_name_debug"
        }
    }
}

repositories {
    // needed for AAPT2, may be needed for other tools
    google()
}

configurations { natives }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation project(':core')

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    // Play Console reports fragment 1.1.0, and the activity 1.0.0 it drags in, as outdated.
    // activity is declared explicitly even though fragment already pulls a current one, so the
    // version that ends up in the bundle is the one written here rather than a transitive
    // accident. core was declared at 1.1.0 but has long resolved to 1.17.0 via
    // gdx-backend-android; the declaration now says what is actually shipped.
    implementation "androidx.fragment:fragment:1.8.9"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.annotation:annotation:1.9.1"
    // appcompat is gone: nothing imports it, no layout uses its widgets, and the app's theme
    // descends from android:Theme, not Theme.AppCompat. Nothing else asked for it either — it
    // appeared in the tree only through this line, and osmdroid, the one plausible candidate,
    // has no transitive dependencies at all. Keeping it would have meant shipping a second
    // outdated AndroidX artifact for no reason.

    implementation "com.google.guava:guava:33.6.0-android"

    api "com.badlogicgames.gdx:gdx-box2d:3.1.1-0"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"

    // UPGRADING THIS WILL BREAK API:
    implementation 'org.mapsforge:mapsforge-map-android:0.17.0'

    implementation 'com.caverock:androidsvg:1.4'

    implementation 'org.openstreetmap.pbf:osmpbf:1.6.1'

    implementation "com.alexdupre:pngj:2.1.2.1"

    implementation 'org.osmdroid:osmdroid-android:6.1.20'

}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86_64/").mkdirs()
        file("libs/x86/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if(outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}

// ':core:generateGeonamesAssetIndex' writes assets/geonames_index.362/filelist.txt into the
// shared '../assets' folder that this module packages. Declare the dependency so Gradle orders
// the asset merge after it; otherwise mergeAssets fails with an implicit-dependency validation error.
tasks.matching { it.name == 'mergeDebugAssets' || it.name == 'mergeReleaseAssets' }.configureEach { mergeTask ->
    mergeTask.dependsOn ':core:generateGeonamesAssetIndex'
}

tasks.register('run', Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_SDK_ROOT"
        }
    } else {
        path = "$System.env.ANDROID_SDK_ROOT"
    }

    def adb = path + "/platform-tools/adb"
    // The component has to match the installed package: applicationId plus the debug build's
    // applicationIdSuffix. This was hardcoded to 'com.peaknav.viewer', which is not the
    // applicationId, so the task always failed with "Activity class ... does not exist".
    def launchPackage = android.defaultConfig.applicationId + android.buildTypes.debug.applicationIdSuffix
    commandLine "$adb", 'shell', 'am', 'start', '-n', "${launchPackage}/com.peaknav.views.AndroidLauncher"
}

eclipse.project.name = appName + "-android"
