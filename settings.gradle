// A module is included only when its directory is present. The GWT `html` target is not checked
// into git at all, and a packaging build that needs only the Android app - F-Droid's, which
// deletes the other targets - must still evaluate without them.
['desktop', 'android', 'ios', 'core', 'headless', 'html'].each { name ->
    if (new File(settingsDir, name).isDirectory()) {
        include name
    }
}
