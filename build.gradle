buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.3"
        // Rasterizes the SVG icon masters into the PNGs the app loads (see :core:generateIcons
        // below). Pure Java, so a fresh clone builds on any machine - and on F-Droid's build
        // server - without librsvg or ImageMagick installed.
        classpath "org.apache.xmlgraphics:batik-transcoder:1.19"
        classpath "org.apache.xmlgraphics:batik-codec:1.19"
    }
}

import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import org.apache.batik.transcoder.TranscoderInput
import org.apache.batik.transcoder.TranscoderOutput
import org.apache.batik.transcoder.image.ImageTranscoder
import org.apache.batik.transcoder.image.PNGTranscoder

/**
 * Scales a PNG master onto a square, transparent canvas of `canvas` pixels. `scale` is the
 * fraction of the canvas the picture fills, centred; 1.0 is a plain resize. Used for the in-app
 * launcher emblem here and for the Android mipmaps in android/build.gradle.
 */
ext.resizePngInto = { File src, File dst, int canvas, double scale ->
    BufferedImage img = ImageIO.read(src)
    int size = (int) Math.round(canvas * scale)
    int inset = (canvas - size).intdiv(2)
    BufferedImage out = new BufferedImage(canvas, canvas, BufferedImage.TYPE_INT_ARGB)
    def g = out.createGraphics()
    g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
    g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
    g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
    g.drawImage(img, inset, inset, size, size, null)
    g.dispose()
    dst.parentFile.mkdirs()
    ImageIO.write(out, 'png', dst)
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
    idea {
        module {
            outputDir file('build/classes/java/main')
            testOutputDir file('build/classes/java/test')
        }
    }
}

// These tasks build index files inside the shared root `assets/` folder. Register
// them ONCE, on :core, so there is a single producer of each output — registering
// them per-subproject (as before) made every non-android module declare the same
// output file, which tripped Gradle's implicit-dependency validation when another
// module's processResources consumed that folder. Every module that packages the
// shared assets depends on the :core tasks: the JVM modules below wire
// processResources.dependsOn, and :android wires mergeAssets.dependsOn
// ':core:generateGeonamesAssetIndex' (see android/build.gradle).
// From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
// The article can be helpful when using assets.txt in your project.
project(':core') {
    // The interface icons the app loads from assets/icons/, rendered from the SVG masters in
    // assets_nonshared/icons/ at the sizes listed in icons.txt there (the same list
    // build_icons.sh reads). *.png is gitignored repository-wide, so this task is what makes a
    // fresh clone - and an F-Droid build - complete.
    def svgDir = file("${rootDir}/assets_nonshared/icons")
    def iconsOut = file("${rootDir}/assets/icons")
    def iconTable = new File(svgDir, 'icons.txt')
    def iconSizes = iconTable.readLines().findAll { it.trim() && !it.trim().startsWith('#') }
            .collectEntries { line ->
                def parts = line.trim().split(':')
                [(parts[0]): [parts[1] as int, parts[2] as int]]
            }
    // The in-app launcher emblem (IntroScreen) is not drawn from an SVG: it is the PeakNav logo
    // itself, kept as a PNG master with its transparency. See TRADEMARK-AND-ASSETS.md.
    def logoAlpha = new File(svgDir, 'peaknav_logo.png')

    tasks.register('generateIcons') {
        group = 'peaknav'
        description = 'Renders the SVG icon masters into the PNGs in assets/icons.'
        inputs.files(iconTable, iconSizes.keySet().collect { new File(svgDir, it + '.svg') }, logoAlpha)
        outputs.files(iconSizes.keySet().collect { new File(iconsOut, it + '.png') },
                new File(iconsOut, 'ic_launcher.png'))
        doLast {
            iconsOut.mkdirs()
            iconSizes.each { name, wh ->
                File svg = new File(svgDir, name + '.svg')
                def transcoder = new PNGTranscoder()
                transcoder.addTranscodingHint(ImageTranscoder.KEY_WIDTH, wh[0] as Float)
                transcoder.addTranscodingHint(ImageTranscoder.KEY_HEIGHT, wh[1] as Float)
                svg.withInputStream { ins ->
                    new File(iconsOut, name + '.png').withOutputStream { outs ->
                        def input = new TranscoderInput(ins)
                        input.setURI(svg.toURI().toString())
                        transcoder.transcode(input, new TranscoderOutput(outs))
                    }
                }
            }
            rootProject.resizePngInto(logoAlpha, new File(iconsOut, 'ic_launcher.png'), 192, 1.0d)
        }
    }

    // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
    tasks.register('generateAssetList') {
        group = 'peaknav'
        description = 'Writes assets/assets.txt, the list of every file under assets/.'
        // After the files that are themselves generated into assets/, or they would be missing
        // from the list on a fresh clone. (The list used to be written while the task was being
        // configured, i.e. before either of them had run.) Not the baked fonts: bakeFonts runs
        // core's own classes, whose resources wait for this list, so it cannot come first; the
        // fonts are left out of the list instead, which nothing reads them from.
        dependsOn 'generateIcons', 'generateGeonamesAssetIndex'
        File assetsFolder = new File("${rootDir}/assets/")
        File assetsFile = new File(assetsFolder, "assets.txt")
        inputs.files(fileTree(assetsFolder) { exclude 'assets.txt', 'fonts_baked/**' })
        outputs.file(assetsFile)
        doLast {
            assetsFile.text = fileTree(assetsFolder) { exclude 'assets.txt', 'fonts_baked/**' }
                    .collect { assetsFolder.relativePath(it) }.sort().join("\n") + "\n"
        }
    }
    // The place-search index, assets/geonames_index.362/, is not in git: it is made from the
    // GeoNames dumps, OpenStreetMap peaks and Wikidata by the tools in core/src/tools and tools/
    // (README.md, "Build"), a long job that needs some 9 GB of OSM extracts. A build from a bare
    // clone - F-Droid's - can instead fetch the very index a release shipped, zipped and attached
    // to that GitHub release, with -PpeaknavFetchSearchIndex=true. The archive's SHA-256 is fixed
    // here, so the build fails rather than ship anything else.
    def searchIndexUrl = 'https://github.com/Upabjojr/PeakNavApp/releases/download/1.3.3/peaknav-search-index-1.3.3.zip'
    def searchIndexSha256 = 'd7824dfe7b13e490f3184131c762bfd3f720782be8d8ad8a85a2691f36e9b73f'
    def fetchSearchIndex = findProperty('peaknavFetchSearchIndex') == 'true'
    tasks.register('fetchSearchIndex') {
        group = 'peaknav'
        description = 'Downloads the search index a release shipped into assets/geonames_index.362/.'
        def indexDir = file("${rootDir}/assets/geonames_index.362")
        def archive = layout.buildDirectory.file('search-index/peaknav-search-index.zip').get().asFile
        inputs.property('url', searchIndexUrl)
        inputs.property('sha256', searchIndexSha256)
        outputs.dir(indexDir)
        doLast {
            archive.parentFile.mkdirs()
            logger.lifecycle("downloading ${searchIndexUrl}")
            new URL(searchIndexUrl).withInputStream { input -> archive.withOutputStream { it << input } }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            archive.eachByte(1 << 16) { buf, len -> digest.update(buf, 0, len) }
            def actual = digest.digest().encodeHex().toString()
            if (actual != searchIndexSha256) {
                throw new GradleException("${archive.name}: SHA-256 ${actual}, expected ${searchIndexSha256}")
            }
            indexDir.deleteDir()
            indexDir.mkdirs()
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    // Only the index's own files, flat in geonames_index.362/: nothing in the
                    // archive can write anywhere else.
                    def m = entry.name =~ /^geonames_index\.362\/([A-Za-z0-9_.]+)$/
                    if (entry.isDirectory()) {
                        return
                    }
                    if (!m.matches()) {
                        throw new GradleException("${archive.name}: unexpected entry ${entry.name}")
                    }
                    new File(indexDir, m.group(1)).withOutputStream { out ->
                        zip.getInputStream(entry).withCloseable { out << it }
                    }
                }
            }
        }
    }

    tasks.register("generateGeonamesAssetIndex") {
        def assetsDir = file("${rootDir}/assets/geonames_index.362")
        def indexFile = new File(assetsDir, "filelist.txt")
        if (fetchSearchIndex) {
            dependsOn 'fetchSearchIndex'
        }

        // The index is optional: it is built separately from the GeoNames dumps, and a checkout
        // without it (F-Droid's, for one) still builds; the app then searches online only.
        // fileTree of a missing directory is simply empty, where inputs.dir would refuse to run.
        inputs.files(fileTree(assetsDir) { exclude 'filelist.txt' })
        outputs.file(indexFile)

        doLast {
            def files = assetsDir.listFiles()
            if (!files) {
                return
            }
            // Each line is "<name>\t<sha-256>". The name alone is not enough to tell two
            // builds apart: Lucene reuses segment names across rebuilds, so a changed index
            // could ship a byte-identical file list, LuceneAssetLoader would see no change,
            // skip its wipe, and mix the old segments table with the new segment data - the
            // index that returned duplicate-or-empty results until the app was reinstalled.
            // Hashing the contents makes the manifest change exactly when the index does.
            // Sorted so identical content yields an identical manifest on any machine.
            def lines = files.findAll { it.name != "filelist.txt" && it.isFile() }
                    .collect { f ->
                        def digest = java.security.MessageDigest.getInstance("SHA-256")
                        f.eachByte(1 << 16) { buf, len -> digest.update(buf, 0, len) }
                        f.name + "\t" + digest.digest().encodeHex().toString()
                    }
                    .sort()
            indexFile.text = lines.join("\n") + "\n"
        }
    }
}

// findAll by name rather than `subprojects - project(':android')`: settings.gradle includes only
// the modules whose directories exist, and a checkout without some of them must still evaluate.
configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'
    // Set this through the `java` extension rather than as a bare project property:
    // the project-level `sourceCompatibility` convention is deprecated in Gradle 8
    // and removed in Gradle 9, where it fails with "unknown property".
    java.sourceCompatibility = 8

    // generateAssetList runs generateIcons and generateGeonamesAssetIndex first.
    processResources.dependsOn ':core:generateAssetList'

    compileJava {
        options.incremental = true
        // Not just sourceCompatibility: that sets the bytecode level but still links
        // against the JDK the build runs on, so a call to a method added after Java 8
        // compiles happily and then throws NoSuchMethodError on an older JVM - the
        // desktop jar dying on a Mac with an older Java. --release links against the
        // real Java 8 API, so javac refuses such a call at build time instead.
        options.release.set(8)
    }
}

subprojects {
    version = "$projectVersion"
    ext.appName = 'peaknav'
    // Maven Central only: no dependency is a snapshot or comes from JitPack, and F-Droid's scanner
    // refuses repositories outside its allowed list (the Sonatype snapshots one among them).
    repositories {
        mavenCentral()
    }
}

eclipse.project.name = 'peaknav' + '-parent'

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
