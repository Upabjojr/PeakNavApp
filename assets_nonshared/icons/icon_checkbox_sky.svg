<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <radialGradient id="sky" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#2a3a70"/>
      <stop offset="1" stop-color="#0a1230"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>

    <!-- crescent moon -->
    <g>
      <circle cx="150" cy="92" r="34" fill="#f2edd8"/>
      <circle cx="138" cy="84" r="30" fill="#132050"/>
    </g>

    <!-- stars (4-point sparkles + dots) -->
    <g fill="#ffffff">
      <path d="M70 150 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
      <path d="M60 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
      <circle cx="110" cy="185" r="3.5"/>
      <circle cx="180" cy="165" r="4"/>
      <circle cx="196" cy="120" r="3"/>
      <circle cx="92" cy="110" r="2.6"/>
      <circle cx="150" cy="205" r="2.6"/>
      <circle cx="40" cy="128" r="2.6"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#0a1230" stroke-width="3"/>
</svg>
