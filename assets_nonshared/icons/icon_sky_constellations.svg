<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <radialGradient id="sky" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#26356e"/>
      <stop offset="1" stop-color="#0b1234"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>

    <!-- a stick figure (Plough / Big Dipper) -->
    <polyline points="46,150 92,168 132,150 176,158 200,120 158,110 132,150"
              fill="none" stroke="#8fb2ff" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
    <g fill="#ffffff">
      <circle cx="46" cy="150" r="7"/>
      <circle cx="92" cy="168" r="8"/>
      <circle cx="132" cy="150" r="7"/>
      <circle cx="176" cy="158" r="6"/>
      <circle cx="200" cy="120" r="7"/>
      <circle cx="158" cy="110" r="6"/>
    </g>
    <!-- scattered background stars -->
    <g fill="#cdd9ff">
      <circle cx="70" cy="70" r="3"/>
      <circle cx="150" cy="62" r="3.5"/>
      <circle cx="196" cy="80" r="2.6"/>
      <circle cx="60" cy="196" r="2.6"/>
      <circle cx="120" cy="205" r="3"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#0b1234" stroke-width="3"/>
</svg>
