<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240mm" height="240mm" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#efe6f7"/>
      <stop offset="1" stop-color="#d6c1e8"/>
    </linearGradient>
    <linearGradient id="towerA" x1="0" y1="40" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a4a97"/>
      <stop offset="1" stop-color="#4b2a63"/>
    </linearGradient>
    <linearGradient id="towerB" x1="0" y1="70" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b6bb0"/>
      <stop offset="1" stop-color="#5f3a7c"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>

  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>

    <!-- ground -->
    <rect x="0" y="196" width="240" height="44" fill="#3d2551"/>

    <!-- skyscrapers, tallest in the middle -->
    <g stroke="#2a163a" stroke-width="2.5">
      <rect x="30"  y="132" width="34" height="66" fill="url(#towerB)"/>
      <rect x="70"  y="96"  width="38" height="102" fill="url(#towerA)"/>
      <!-- central tower with a stepped top -->
      <rect x="112" y="70"  width="40" height="128" fill="url(#towerA)"/>
      <rect x="122" y="52"  width="20" height="24" fill="url(#towerA)"/>
      <rect x="156" y="110" width="34" height="88" fill="url(#towerB)"/>
      <rect x="196" y="146" width="30" height="52" fill="url(#towerB)"/>
    </g>

    <!-- lit windows -->
    <g fill="#ffe08a">
      <rect x="38"  y="142" width="7" height="9"/><rect x="50" y="142" width="7" height="9"/>
      <rect x="38"  y="160" width="7" height="9"/><rect x="50" y="160" width="7" height="9"/>
      <rect x="78"  y="108" width="8" height="10"/><rect x="92" y="108" width="8" height="10"/>
      <rect x="78"  y="130" width="8" height="10"/><rect x="92" y="130" width="8" height="10"/>
      <rect x="78"  y="152" width="8" height="10"/><rect x="92" y="152" width="8" height="10"/>
      <rect x="120" y="86" width="9" height="11"/><rect x="135" y="86" width="9" height="11"/>
      <rect x="120" y="110" width="9" height="11"/><rect x="135" y="110" width="9" height="11"/>
      <rect x="120" y="134" width="9" height="11"/><rect x="135" y="134" width="9" height="11"/>
      <rect x="120" y="158" width="9" height="11"/><rect x="135" y="158" width="9" height="11"/>
      <rect x="164" y="122" width="8" height="10"/><rect x="176" y="122" width="8" height="10"/>
      <rect x="164" y="144" width="8" height="10"/><rect x="176" y="144" width="8" height="10"/>
      <rect x="202" y="158" width="7" height="9"/><rect x="213" y="158" width="7" height="9"/>
    </g>
  </g>

  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#2a163a" stroke-width="3"/>
</svg>
