<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PeakNav in-app splash emblem (IntroScreen). Not the Android home-screen icon. -->
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="4" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe7c2"/>
      <stop offset="0.5" stop-color="#9fd0ea"/>
      <stop offset="1" stop-color="#4f95c4"/>
    </linearGradient>
    <linearGradient id="rockBack" x1="0" y1="70" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a98763"/><stop offset="1" stop-color="#7c5a3a"/>
    </linearGradient>
    <linearGradient id="rockFront" x1="0" y1="80" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d5836"/><stop offset="1" stop-color="#4f351f"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="#0e3348"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>
    <circle cx="176" cy="70" r="22" fill="#ffd873" opacity="0.95"/>

    <!-- back range -->
    <path d="M-10 210 L40 120 L88 170 L120 96 L166 160 L210 118 L250 210 Z"
          fill="url(#rockBack)" stroke="#4d3320" stroke-width="2"/>
    <!-- front peaks -->
    <path d="M-10 214 L70 96 L150 214 Z" fill="url(#rockFront)" stroke="#3a2716" stroke-width="2.5"/>
    <path d="M104 214 L176 104 L246 214 Z" fill="url(#rockFront)" stroke="#3a2716" stroke-width="2.5"/>
    <!-- snow caps -->
    <path d="M70 96 L50 128 q10 -8 20 0 q10 8 20 0 z" fill="#ffffff" stroke="#cfe1ea" stroke-width="1.5"/>
    <path d="M176 104 L156 136 q10 -8 20 0 q10 8 20 0 z" fill="#ffffff" stroke="#cfe1ea" stroke-width="1.5"/>

    <!-- compass needle emblem -->
    <g transform="translate(120,150) rotate(28)" opacity="0.96">
      <circle cx="0" cy="0" r="30" fill="#ffffff" fill-opacity="0.9" stroke="#12222e" stroke-width="4"/>
      <path d="M0 -26 L8 0 L0 -4 L-8 0 Z" fill="#d23b32" stroke="#7a1c17" stroke-width="1.5"/>
      <path d="M0 26 L8 0 L0 4 L-8 0 Z" fill="#33404a" stroke="#12222e" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#12222e"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="#0e3348" stroke-width="4"/>
</svg>
