<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath></defs>
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <!-- day half (left) -->
    <rect x="0" y="0" width="120" height="240" fill="#7fc4ef"/>
    <!-- night half (right) -->
    <rect x="120" y="0" width="120" height="240" fill="#141f45"/>

    <!-- sun on the day side -->
    <g stroke="#f2a41e" stroke-width="7" stroke-linecap="round">
      <line x1="62" y1="70" x2="62" y2="52"/>
      <line x1="62" y1="188" x2="62" y2="170"/>
      <line x1="24" y1="120" x2="42" y2="120"/>
      <line x1="30" y1="78" x2="43" y2="91"/>
      <line x1="30" y1="162" x2="43" y2="149"/>
    </g>
    <circle cx="62" cy="120" r="26" fill="#ffd23f" stroke="#d9861a" stroke-width="3"/>

    <!-- crescent moon + star on the night side -->
    <path d="M188 84 a38 38 0 1 0 0 72 a30 30 0 1 1 0 -72 z" fill="#f2edd8"/>
    <path d="M150 168 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#ffffff"/>
    <circle cx="205" cy="150" r="3" fill="#ffffff"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#12203f" stroke-width="3"/>
</svg>
