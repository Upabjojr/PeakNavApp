<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <clipPath id="photo"><rect x="66" y="80" width="128" height="98" rx="8"/></clipPath>
    <linearGradient id="gsky" x1="0" y1="80" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe6f7"/>
      <stop offset="1" stop-color="#eaf6ea"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <!-- back photo, offset -->
    <rect x="48" y="66" width="128" height="98" rx="8" fill="#f2f2f2" stroke="#1d2530" stroke-width="3" transform="rotate(-7 112 115)"/>
    <!-- front photo frame -->
    <rect x="66" y="80" width="128" height="98" rx="8" fill="#ffffff" stroke="#1d2530" stroke-width="3"/>
    <g clip-path="url(#photo)">
      <rect x="66" y="80" width="128" height="98" fill="url(#gsky)"/>
      <circle cx="168" cy="104" r="13" fill="#f6b64c"/>
      <!-- mountains -->
      <path d="M66 178 L104 122 L134 160 L160 128 L194 178 Z" fill="#5c8a4a" stroke="#3c6330" stroke-width="2"/>
      <path d="M104 122 L92 138 q12 -6 24 0 z" fill="#ffffff"/>
      <path d="M160 128 L150 142 q10 -5 20 0 z" fill="#ffffff"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#10202b" stroke-width="3"/>
</svg>
