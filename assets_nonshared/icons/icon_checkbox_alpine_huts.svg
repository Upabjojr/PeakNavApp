<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="145" height="134" viewBox="0 0 145 134" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="72.5" cy="67" r="67"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfeaf7"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
  </defs>

  <circle cx="72.5" cy="67" r="67" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="145" height="134" fill="url(#sky)"/>

    <!-- mountain behind -->
    <path d="M4 104 L44 44 L74 84 L104 40 L142 104 Z" fill="#8a97a6" stroke="#59636f" stroke-width="2"/>
    <path d="M44 44 L34 60 q10 -5 20 0 z" fill="#ffffff"/>
    <path d="M104 40 L94 56 q10 -5 20 0 z" fill="#ffffff"/>

    <!-- snow ground -->
    <rect x="0" y="100" width="145" height="34" fill="#f2f7fb"/>

    <!-- pine tree -->
    <g stroke="#245a2a" stroke-width="1.5">
      <rect x="26" y="94" width="6" height="12" fill="#5a3a22" stroke="#3a2414"/>
      <path d="M29 58 L16 84 h26 z" fill="#2f7a35"/>
      <path d="M29 70 L18 94 h22 z" fill="#357f3a"/>
    </g>

    <!-- alpine hut: gabled wooden cabin with snowy roof -->
    <g stroke="#4a2f18" stroke-width="2.5" stroke-linejoin="round">
      <rect x="64" y="76" width="56" height="34" fill="#a6703c"/>
      <!-- roof -->
      <path d="M58 78 L92 50 L126 78 Z" fill="#6e4726"/>
      <!-- snow on roof -->
      <path d="M58 78 L92 50 L126 78 q-34 -10 -68 0 z" fill="#ffffff" stroke="#cfe1ea" stroke-width="1.5"/>
      <!-- door + lit window -->
      <rect x="80" y="88" width="14" height="22" fill="#5a3a20"/>
      <rect x="100" y="88" width="12" height="12" fill="#ffd35a" stroke="#4a2f18" stroke-width="2"/>
    </g>
    <!-- little flag on the peak of the roof -->
    <line x1="92" y1="50" x2="92" y2="40" stroke="#4a2f18" stroke-width="2"/>
    <path d="M92 41 l12 4 -12 4 z" fill="#d23b32"/>
  </g>
  <circle cx="72.5" cy="67" r="65.5" fill="none" stroke="#2f3f24" stroke-width="3"/>
</svg>
