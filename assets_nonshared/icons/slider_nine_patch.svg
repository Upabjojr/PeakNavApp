<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Slider track: a dark bar with a light edge, so it shows against dark terrain as well as sky. -->
<svg width="30" height="50" viewBox="0 0 30 50" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <rect x="8.5" y="8.5" width="13" height="33" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="10" y="10" width="10" height="30" fill="#000000"/>
</svg>
