<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c3a"/>
      <stop offset="1" stop-color="#1d3d6e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fd0"/>
      <stop offset="1" stop-color="#1f4f9c"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#ffffff" opacity="0.8">
      <circle cx="40" cy="48" r="2.5"/><circle cx="196" cy="60" r="2"/><circle cx="70" cy="196" r="2"/>
      <circle cx="204" cy="176" r="2.5"/><circle cx="150" cy="36" r="1.8"/>
    </g>

    <g transform="rotate(-20 120 120)">
      <!-- solar panels -->
      <g stroke="#0f2136" stroke-width="2.5">
        <rect x="14" y="104" width="66" height="34" fill="url(#panel)"/>
        <rect x="160" y="104" width="66" height="34" fill="url(#panel)"/>
      </g>
      <g stroke="#bcd6f2" stroke-width="1.5" opacity="0.8">
        <path d="M36 104 v34 M58 104 v34 M14 121 h66"/>
        <path d="M182 104 v34 M204 104 v34 M160 121 h66"/>
      </g>
      <!-- connecting struts -->
      <rect x="80" y="118" width="80" height="6" fill="#8a97a6"/>
      <!-- body -->
      <rect x="98" y="98" width="44" height="46" rx="6" fill="#c9d3de" stroke="#0f2136" stroke-width="3"/>
      <rect x="106" y="106" width="28" height="14" rx="2" fill="#5a6675"/>
      <!-- dish -->
      <ellipse cx="120" cy="158" rx="20" ry="9" fill="#e6edf4" stroke="#0f2136" stroke-width="2.5"/>
      <line x1="120" y1="144" x2="120" y2="152" stroke="#0f2136" stroke-width="3"/>
      <circle cx="120" cy="158" r="3" fill="#0f2136"/>
    </g>

    <!-- signal arcs -->
    <g fill="none" stroke="#8fe08a" stroke-width="4" stroke-linecap="round">
      <path d="M158 176 a26 26 0 0 1 18 18"/>
      <path d="M150 190 a40 40 0 0 1 28 28"/>
    </g>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#0b1c3a" stroke-width="3"/>
</svg>
