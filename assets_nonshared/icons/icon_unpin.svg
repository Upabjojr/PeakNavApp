  <line x1="52" y1="188" x2="188" y2="52" stroke="#2b333c" stroke-width="20" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#2b333c" stroke-width="3"/>
</svg>
