<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Horizon compass: drawn (and rotated) over the map, so the background stays transparent. -->
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- translucent disc so the rose reads over any terrain -->
  <circle cx="120" cy="120" r="112" fill="#ffffff" fill-opacity="0.82" stroke="#12222e" stroke-width="6"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#12222e" stroke-width="2" opacity="0.5"/>

  <!-- tick marks every 30° -->
  <g stroke="#12222e" stroke-width="3" opacity="0.7">
    <line x1="120" y1="24" x2="120" y2="38"/>
    <line x1="120" y1="202" x2="120" y2="216"/>
    <line x1="24" y1="120" x2="38" y2="120"/>
    <line x1="202" y1="120" x2="216" y2="120"/>
    <g stroke-width="2">
      <line x1="72" y1="37" x2="79" y2="49"/><line x1="168" y1="37" x2="161" y2="49"/>
      <line x1="72" y1="203" x2="79" y2="191"/><line x1="168" y1="203" x2="161" y2="191"/>
    </g>
  </g>

  <!-- compass needle: red north, white south -->
  <path d="M120 40 L138 120 L120 116 L102 120 Z" fill="#d23b32" stroke="#7a1c17" stroke-width="2"/>
  <path d="M120 200 L138 120 L120 124 L102 120 Z" fill="#f0f0f0" stroke="#8a8f96" stroke-width="2"/>
  <circle cx="120" cy="120" r="9" fill="#2a3038" stroke="#12222e" stroke-width="2"/>

  <!-- cardinal letters -->
  <g fill="#12222e" font-family="sans-serif" font-weight="bold" font-size="26" text-anchor="middle">
    <text x="120" y="72" fill="#d23b32">N</text>
    <text x="120" y="182">S</text>
    <text x="74" y="130">W</text>
    <text x="166" y="130">E</text>
  </g>
</svg>
