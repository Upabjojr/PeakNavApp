<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- "Save as a marker": a flag on a pole, planted on the ground, with a plus beside it. -->
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <!-- the ground it stands on -->
  <ellipse cx="96" cy="186" rx="34" ry="9" fill="#10202b" opacity="0.22"/>
  <!-- pole -->
  <line x1="84" y1="186" x2="84" y2="50" stroke="#2b333c" stroke-width="10" stroke-linecap="round"/>
  <!-- the flag, swallow-tailed -->
  <path d="M88 54 L160 54 L140 82 L160 110 L88 110 Z"
        fill="#1f8ae0" stroke="#10456f" stroke-width="5" stroke-linejoin="round"/>
  <!-- plus -->
  <g stroke="#2b333c" stroke-width="12" stroke-linecap="round">
    <line x1="170" y1="146" x2="170" y2="190"/>
    <line x1="148" y1="168" x2="192" y2="168"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#10202b" stroke-width="3"/>
</svg>
