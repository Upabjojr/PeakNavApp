<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="userA" x1="0" y1="70" x2="0" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa0e0"/>
      <stop offset="1" stop-color="#2f6fb0"/>
    </linearGradient>
    <linearGradient id="userB" x1="0" y1="70" x2="0" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ad07a"/>
      <stop offset="1" stop-color="#4f9b3f"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <!-- back user (green) -->
    <g transform="translate(150,120) scale(0.82)">
      <circle cx="0" cy="-34" r="24" fill="url(#userB)" stroke="#2f6a24" stroke-width="3"/>
      <path d="M-40 44 a40 40 0 0 1 80 0 z" fill="url(#userB)" stroke="#2f6a24" stroke-width="3"/>
    </g>
    <!-- front user (blue) -->
    <g transform="translate(92,124) scale(0.95)">
      <circle cx="0" cy="-34" r="24" fill="url(#userA)" stroke="#1f4d7d" stroke-width="3"/>
      <path d="M-40 44 a40 40 0 0 1 80 0 z" fill="url(#userA)" stroke="#1f4d7d" stroke-width="3"/>
    </g>
    <!-- swap arrows -->
    <g fill="none" stroke="#e07a2a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 44 h44 a18 18 0 0 1 18 18"/>
      <path d="M156 176 h-44 a18 18 0 0 1 -18 -18"/>
    </g>
    <path d="M150 60 l-4 -16 16 6 z" fill="#e07a2a"/>
    <path d="M90 160 l4 16 -16 -6 z" fill="#e07a2a"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#10202b" stroke-width="3"/>
</svg>
