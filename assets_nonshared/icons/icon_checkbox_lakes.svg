<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240mm" height="240mm" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#c2e5f5"/>
    </linearGradient>
    <linearGradient id="farRock" x1="0" y1="50" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93a9c0"/>
      <stop offset="1" stop-color="#5b7490"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="112" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc267"/>
      <stop offset="1" stop-color="#357a2c"/>
    </linearGradient>
    <!-- The far edge of the water catches the sky, the near edge is deep. -->
    <linearGradient id="water" x1="0" y1="120" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79cbe9"/>
      <stop offset="0.45" stop-color="#2b8cc4"/>
      <stop offset="1" stop-color="#15537f"/>
    </linearGradient>
  </defs>

  <!-- white badge background -->
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>

  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="130" fill="url(#sky)"/>

    <!-- distant range closing off the valley -->
    <path d="M-10 128 L26 74 L56 108 L92 58 L128 104 L164 68 L200 112 L250 128 Z"
          fill="url(#farRock)" stroke="#3f5164" stroke-width="2"/>
    <!-- snow on the two high summits -->
    <path d="M92 58 L78 80 q7 -6 14 0 q7 6 14 0 z" fill="#ffffff" stroke="#cfe1ea" stroke-width="1.2"/>
    <path d="M164 68 L151 89 q6.5 -6 13 0 q6.5 6 13 0 z" fill="#ffffff" stroke="#cfe1ea" stroke-width="1.2"/>

    <!-- land: fills everything below the range, so the water is enclosed by shore on all sides
         (that ring of land is what separates a lake from the open sea of the islands icon) -->
    <path d="M-10 120 C 40 112, 90 118, 120 116 C 160 113, 210 118, 250 122 L250 250 L-10 250 Z"
          fill="url(#shore)" stroke="#2f6b26" stroke-width="2"/>

    <!-- the lake itself: an irregular basin, wider than it is deep (seen in perspective) -->
    <path d="M34 158
             C 36 140, 62 126, 98 122
             C 128 119, 170 124, 196 138
             C 208 146, 211 155, 205 163
             C 196 179, 158 193, 116 194
             C 76 195, 44 181, 35 168
             C 32 165, 32 161, 34 158 Z"
          fill="url(#water)" stroke="#0f4468" stroke-width="2.5"/>

    <!-- Pale band along the far shore: the water there mirrors the sky, which gives the surface
         depth. Kept as one asymmetric band rather than paired marks, which read as a face. -->
    <path d="M46 148 C 74 130, 132 124, 190 140 C 150 134, 84 137, 46 148 Z"
          fill="#ffffff" opacity="0.30"/>

    <!-- Ripples as the conventional stacked wavy-water motif. Earlier attempts (two arcs side by
         side, or a single arc) accidentally read as eyes and a mouth inside the oval basin. -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.65">
      <path d="M83 160 q17.5 -5 35 0 q17.5 5 35 0" stroke-width="3.5"/>
      <path d="M74 174 q21 -6 42 0 q21 6 42 0" stroke-width="4"/>
      <path d="M96 187 q14 -4 28 0 q14 4 28 0" stroke-width="3.5"/>
    </g>
  </g>

  <!-- crisp rim -->
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#0f4468" stroke-width="3"/>
</svg>
