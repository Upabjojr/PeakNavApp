<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fc36a"/>
      <stop offset="1" stop-color="#5c9c40"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d747c"/>
      <stop offset="1" stop-color="#41474e"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#grass)"/>
    <!-- road receding to a vanishing point (perspective) -->
    <path d="M14 240 L96 24 L144 24 L226 240 Z" fill="url(#asphalt)" stroke="#2e3238" stroke-width="3"/>
    <!-- shoulder lines -->
    <path d="M40 240 L104 40" fill="none" stroke="#e9edf1" stroke-width="4" opacity="0.85"/>
    <path d="M200 240 L136 40" fill="none" stroke="#e9edf1" stroke-width="4" opacity="0.85"/>
    <!-- dashed centre line -->
    <path d="M120 236 L120 30" fill="none" stroke="#ffd23f" stroke-width="9"
          stroke-dasharray="22 20" stroke-linecap="butt"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#233a1e" stroke-width="3"/>
</svg>
