<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- "Locate me" button, GPS fix active: bright blue target with a glow. -->
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6ecff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#glow)"/>
  <g clip-path="url(#disc)">
    <g stroke="#1f7fe0" stroke-width="10" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="58"/>
      <line x1="120" y1="182" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="58" y2="120"/>
      <line x1="182" y1="120" x2="210" y2="120"/>
    </g>
    <circle cx="120" cy="120" r="52" fill="none" stroke="#1f7fe0" stroke-width="10"/>
    <circle cx="120" cy="120" r="20" fill="#1f7fe0"/>
    <circle cx="112" cy="112" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#155ba6" stroke-width="3"/>
</svg>
