<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240mm" height="240mm" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="sea" x1="0" y1="150" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bb7d6"/>
      <stop offset="1" stop-color="#1f6f97"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#cdeaf6"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="130" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d99a"/>
      <stop offset="1" stop-color="#d9b46a"/>
    </linearGradient>
    <linearGradient id="veg" x1="0" y1="88" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc267"/>
      <stop offset="1" stop-color="#3f8a34"/>
    </linearGradient>
  </defs>

  <!-- white badge background -->
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>

  <g clip-path="url(#disc)">
    <!-- sky then sea -->
    <rect x="0" y="0" width="240" height="156" fill="url(#sky)"/>
    <rect x="0" y="150" width="240" height="90" fill="url(#sea)"/>

    <!-- distant swell lines -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45">
      <path d="M12 168 q10 -7 20 0 q10 7 20 0"/>
      <path d="M190 176 q10 -7 20 0 q10 7 20 0"/>
    </g>

    <!-- ISLAND: one landmass emerging from the water.
         Sand silhouette first; its base dips below the waterline so it is anchored, not floating. -->
    <path d="M42 150
             C 52 132, 78 112, 104 106
             C 124 101, 150 116, 176 132
             C 190 141, 198 148, 200 154
             C 176 172, 132 180, 96 178
             C 70 176, 50 166, 42 150 Z"
          fill="url(#sand)" stroke="#b8924f" stroke-width="2"/>

    <!-- green vegetated cap sitting on the sand, leaving a beach at the shore -->
    <path d="M60 146
             C 70 122, 92 104, 112 100
             C 130 97, 152 110, 168 132
             C 174 140, 176 145, 176 148
             C 146 156, 92 156, 60 146 Z"
          fill="url(#veg)" stroke="#2f6b26" stroke-width="2"/>
    <!-- a little shading ridge on the hill -->
    <path d="M96 118 C 106 108, 122 106, 136 116" fill="none" stroke="#2f6b26" stroke-width="2" opacity="0.5"/>

    <!-- palm tree growing from the summit -->
    <path d="M116 108 q-5 -30 4 -52" fill="none" stroke="#7a4a1e" stroke-width="7" stroke-linecap="round"/>
    <path d="M116 108 q-5 -30 4 -52" fill="none" stroke="#9c6a34" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#3f8f3a" stroke="#2c6a28" stroke-width="1.5">
      <path d="M120 56 q-30 -14 -52 -2 q26 -6 52 12 z"/>
      <path d="M120 56 q30 -14 52 -2 q-26 -6 -52 12 z"/>
      <path d="M120 56 q-18 -30 -42 -34 q22 10 42 40 z"/>
      <path d="M120 56 q18 -30 42 -34 q-22 10 -42 40 z"/>
    </g>
    <circle cx="120" cy="57" r="6" fill="#c9761f"/>

    <!-- foam waves lapping the shoreline, in front of the land -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M44 158 q14 8 28 0 q14 -8 28 0"/>
      <path d="M150 162 q14 8 28 0 q14 -8 28 0"/>
    </g>
  </g>

  <!-- crisp rim -->
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#0d3446" stroke-width="3"/>
</svg>
