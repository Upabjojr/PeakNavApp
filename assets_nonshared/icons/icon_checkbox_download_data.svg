<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="cloud" x1="0" y1="70" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fb8ec"/>
      <stop offset="1" stop-color="#3f7fc8"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="#eaf3fb"/>

    <!-- cloud -->
    <path d="M74 150
             a34 34 0 0 1 4 -67
             a40 40 0 0 1 74 -6
             a30 30 0 0 1 6 73 z"
          fill="url(#cloud)" stroke="#255a94" stroke-width="3" stroke-linejoin="round"/>

    <!-- download arrow -->
    <g stroke="#1f4a7c" stroke-width="3">
      <rect x="108" y="120" width="24" height="42" fill="#ffffff"/>
      <path d="M92 158 L120 192 L148 158 Z" fill="#ffffff"/>
    </g>

    <!-- ground / receiving tray -->
    <rect x="70" y="196" width="100" height="10" rx="4" fill="#255a94"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#1f4a7c" stroke-width="3"/>
</svg>
