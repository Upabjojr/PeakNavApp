<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- "Locate me" button, no GPS fix yet: neutral grey target. -->
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath></defs>
  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <!-- crosshair spokes -->
    <g stroke="#6b747f" stroke-width="10" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="58"/>
      <line x1="120" y1="182" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="58" y2="120"/>
      <line x1="182" y1="120" x2="210" y2="120"/>
    </g>
    <circle cx="120" cy="120" r="52" fill="none" stroke="#6b747f" stroke-width="10"/>
    <circle cx="120" cy="120" r="18" fill="#6b747f"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#3c434c" stroke-width="3"/>
</svg>
