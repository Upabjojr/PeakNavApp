<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="240" height="240" viewBox="0 0 240 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="disc"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0f2"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.55" stop-color="#ffce3d"/>
      <stop offset="1" stop-color="#f6a01e"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="120" fill="#ffffff"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sky)"/>
    <!-- rays -->
    <g stroke="#f6a81e" stroke-width="11" stroke-linecap="round">
      <line x1="120" y1="26" x2="120" y2="52"/>
      <line x1="120" y1="188" x2="120" y2="214"/>
      <line x1="26" y1="120" x2="52" y2="120"/>
      <line x1="188" y1="120" x2="214" y2="120"/>
      <line x1="53" y1="53" x2="72" y2="72"/>
      <line x1="187" y1="53" x2="168" y2="72"/>
      <line x1="53" y1="187" x2="72" y2="168"/>
      <line x1="187" y1="187" x2="168" y2="168"/>
    </g>
    <circle cx="120" cy="120" r="52" fill="url(#sun)" stroke="#d9861a" stroke-width="3"/>
    <circle cx="104" cy="104" r="16" fill="#fff6c8" opacity="0.7"/>
  </g>
  <circle cx="120" cy="120" r="118.5" fill="none" stroke="#b06f12" stroke-width="3"/>
</svg>
