<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PeakNav tutorial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--
  The "?" tutorial: a slideshow of screenshots of the app with a ring on the widget each
  slide is about. The screenshots and the SLIDES block below are produced by
  tools/tutorial_slides.py from pictures of the running app and the widget places it
  reports, so the pictures and the rings follow the app; the captions are the app's own
  translations (TutorialStrings.KEYS).

  Shown in a WebView on Android and iOS and in the system browser on the desktop. The
  three platforms hand the screenshots in through get_image() (base64 on the phones, a
  temp directory on the desktop) and find their names in the SLIDES block itself
  (TutorialImages.namesIn), so this page must reference them only by file name through
  that function. Plain ES5-era JavaScript and CSS with wide support: WebViews on older
  phones are part of the audience.

  The pictures are phone screenshots, taller than they are wide. A narrow window (a phone
  held upright) puts the caption under the picture; a wide one (a tablet, a desktop
  browser, a phone on its side) puts it beside, so the picture keeps the full height.
-->
<style>
:root {
    --caption-height: 118px;
    --page-padding: 14px;
    --ink: #e8ecf1;
    --muted: #a7b1bf;
    --ring: #2ecc71;
}

* { box-sizing: border-box; }

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: #14181d;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.stage {
    flex: 0 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--page-padding);
}

/* Hugs the picture exactly: the ring is placed in percentages of this box. */
.frame {
    position: relative;
    display: inline-block;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    touch-action: pan-y;
}

.frame img {
    display: block;
    max-width: calc(100vw - (2 * var(--page-padding)));
    max-height: calc(100vh - var(--caption-height) - (2 * var(--page-padding)));
    width: auto;
    height: auto;
}

/* Previous / next, inside the picture. */
.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: rgba(12, 16, 20, 0.55);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
}

.nav:hover:not(:disabled) { background: rgba(12, 16, 20, 0.85); }
/* A tap leaves the arrow focused, and a WebView draws a box around it; a keyboard's focus
   still shows (browsers without :focus-visible simply keep their own ring). */
.nav:focus { outline: none; }
.nav:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.nav:disabled { opacity: 0.25; cursor: default; }
.prev { left: 12px; }
.next { right: 12px; }

/* The ring: a pulsing circle whose centre and size come from the slide data, in
   fractions of the picture, so it lands on its widget at any window size. */
#ring {
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid var(--ring);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.35), 0 0 18px rgba(46, 204, 113, 0.9);
    animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50%      { transform: translate(-50%, -50%) scale(0.86); opacity: 0.75; }
}

.caption-bar {
    flex: 0 0 auto;
    height: var(--caption-height);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 16px 12px;
    text-align: center;
}

#captionText {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.2;
}

#detailText {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.3;
    max-width: 60ch;
}

/* Progress: a bar and "n / N". With this many slides a dot each is a smudge, and on a
   narrow phone they would wrap into several rows. */
.progress {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin-top: 2px;
}

.progress-track {
    flex: 1 1 auto;
    height: 4px;
    border-radius: 2px;
    background: #39424f;
    overflow: hidden;
}

#progressFill {
    height: 100%;
    width: 0;
    border-radius: 2px;
    background: var(--ring);
    transition: width 0.2s ease;
}

#counter {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}

@media (max-width: 620px) {
    :root { --caption-height: 104px; --page-padding: 8px; }
    #captionText { font-size: 17px; }
    #detailText { font-size: 12px; }
    .nav { width: 38px; height: 38px; font-size: 17px; }
}

/* Wide window - a tablet, a desktop browser, a phone on its side: the caption moves beside
   the picture, which then has the whole height of the window. */
@media (min-aspect-ratio: 1/1) {
    body { flex-direction: row; align-items: center; }

    .stage { flex: 1 1 auto; height: 100%; }

    .frame img {
        max-width: calc(60vw - (2 * var(--page-padding)));
        max-height: calc(100vh - (2 * var(--page-padding)));
    }

    .caption-bar {
        flex: 0 0 auto;
        width: min(38vw, 420px);
        height: auto;
        align-items: flex-start;
        text-align: left;
        padding: 0 24px 0 4px;
        gap: 10px;
    }

    #detailText { font-size: 15px; }
    .progress { max-width: 100%; }
}
</style>
</head>

<body>

<div class="stage">
    <div class="frame" id="frame">
        <div id="picture"></div>
        <div id="ring"></div>
        <button class="nav prev" id="prevButton" aria-label="Previous">&#10094;</button>
        <button class="nav next" id="nextButton" aria-label="Next">&#10095;</button>
    </div>
</div>

<div class="caption-bar">
    <div id="captionText"></div>
    <div id="detailText"></div>
    <div class="progress">
        <div class="progress-track"><div id="progressFill"></div></div>
        <div id="counter"></div>
    </div>
</div>

<script>
// The platforms overload this with their own way of finding the screenshots.
function get_image(img_path) {
    var img = new Image();
    img.src = img_path;
    return img;
}

// OVERLOAD::get_image

// The captions, from the app's own translations. Each platform replaces this with a
// lookup table for the device's language (TutorialStrings.asJavaScript); on its own it
// returns the key, which is what a browser opening this file directly will show.
function get_string(k) {
    return k;
}

// OVERLOAD::get_string

// SLIDES-BEGIN (written by tools/tutorial_slides.py)
const SLIDES = [

    }

  {

    "key": "Tutorial_help",

      "rh": 0.0391
    }
  }
];
// SLIDES-END

var images = {};
for (var i = 0; i < SLIDES.length; i++) {
    var name = SLIDES[i].image;
    if (!images[name]) {
        images[name] = get_image(name);
    }
}

var slideIndex = 0;

function showSlide() {
    var slide = SLIDES[slideIndex];
    var picture = document.getElementById("picture");
    picture.innerHTML = "";
    picture.appendChild(images[slide.image]);
    document.getElementById("captionText").textContent = get_string(slide.key);
    document.getElementById("detailText").textContent = get_string(slide.key + "_detail");

    var ring = document.getElementById("ring");
    if (slide.marker) {
        var m = slide.marker;
        ring.style.display = "block";
        ring.style.left = (m.cx * 100) + "%";
        ring.style.top = (m.cy * 100) + "%";
        // half-widths in fractions of the picture: a circle on a button, an ellipse on a bar
        ring.style.width = (m.rw * 2 * 100) + "%";
        ring.style.height = (m.rh * 2 * 100) + "%";
    } else {
        ring.style.display = "none";
    }

    document.getElementById("prevButton").disabled = (slideIndex === 0);
    document.getElementById("nextButton").disabled = (slideIndex === SLIDES.length - 1);
    document.getElementById("counter").textContent = (slideIndex + 1) + " / " + SLIDES.length;
    document.getElementById("progressFill").style.width =
        (100 * (slideIndex + 1) / SLIDES.length) + "%";
}

function goToSlide(n) {
    if (n < 0 || n >= SLIDES.length) {
        return;
    }
    slideIndex = n;
    showSlide();
}

document.getElementById("prevButton").onclick = function () { goToSlide(slideIndex - 1); };
document.getElementById("nextButton").onclick = function () { goToSlide(slideIndex + 1); };

document.addEventListener("keydown", function (event) {
    if (event.keyCode === 37) { goToSlide(slideIndex - 1); }
    else if (event.keyCode === 39 || event.keyCode === 32) { goToSlide(slideIndex + 1); }
});

// Swipe on the picture, the way a phone's photo viewer moves.
(function () {
    var startX = null, startY = null;
    var frame = document.getElementById("frame");
    frame.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }
    }, {passive: true});
    frame.addEventListener("touchend", function (e) {
        if (startX === null) { return; }
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        startX = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) {
            goToSlide(slideIndex + (dx < 0 ? 1 : -1));
        }
    }, {passive: true});
    // A tap on the right half of the picture goes forward, on the left half back.
    frame.addEventListener("click", function (e) {
        if (e.target.tagName === "BUTTON") { return; }
        var rect = frame.getBoundingClientRect();
        goToSlide(slideIndex + ((e.clientX - rect.left) > rect.width / 2 ? 1 : -1));
    });
})();

if (SLIDES.length > 0) {
    // #7 in the URL opens at slide 7: for links into the tutorial, and for screenshots of it
    var start = parseInt(location.hash.substring(1), 10);
    if (!isNaN(start) && start >= 1 && start <= SLIDES.length) {
        slideIndex = start - 1;
    }
    showSlide();
}
</script>
