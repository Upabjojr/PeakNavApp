Provider_url_help=Disse plassholderne bruker samme syntaks som OpenStreetMap-editoren (iD). Legg bare til bilder du har lov til å bruke til kartlegging.\n\nWMS-plassholdere:\n{proj}: projeksjonen, alltid EPSG:3857\n{wkid}: samme projeksjonskode uten EPSG:-prefikset (3857)\n{width}, {height}: bildestørrelsen, alltid 256\n{bbox}: flisens avgrensning, som minX,minY,maxX,maxY\n\nTMS-plassholdere:\n{zoom} eller {z}, {x}, {y}: flisens zoom, kolonne og rad\n{-y} eller {ty}: raden telt fra bunnen (TMS)\n{switch:a,b,c}: fordeler forespørsler på flere tjenere\n{u}: quadkey i Bing-stil\n{@2x} eller {r}: suffiks for høy oppløsning\n\nEksempel, som i OpenStreetMap-editoren:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
