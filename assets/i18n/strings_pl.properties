Provider_url_help=Te symbole zastępcze mają tę samą składnię co w edytorze OpenStreetMap (iD). Dodawaj tylko te zdjęcia, których możesz używać do mapowania.\n\nSymbole WMS:\n{proj}: odwzorowanie, zawsze EPSG:3857\n{wkid}: ten sam kod odwzorowania bez prefiksu EPSG: (3857)\n{width}, {height}: rozmiar obrazu, zawsze 256\n{bbox}: granice kafelka jako minX,minY,maxX,maxY\n\nSymbole TMS:\n{zoom} lub {z}, {x}, {y}: przybliżenie, kolumna i wiersz kafelka\n{-y} lub {ty}: wiersz liczony od dołu (TMS)\n{switch:a,b,c}: rozkłada żądania na kilka nazw hostów\n{u}: quadkey w stylu Bing\n{@2x} lub {r}: przyrostek wysokiej rozdzielczości\n\nPrzykład, tak jak w edytorze OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
