Tutorial_satellite=Zdjęcia satelitarne
Tutorial_satellite_detail=Jedno z kilku źródeł zdjęć, do wyboru w opcjach.
Tutorial_share=Udostępnij
Tutorial_share_detail=Zapisz lub udostępnij widok jako obraz. W danych EXIF zachowuje miejsce, w którym powstał, i kierunek patrzenia.
Tutorial_here=Gdzie jestem
Tutorial_here_detail=Przejdź do swojej pozycji GPS.
Tutorial_tap=Stuknij punkt
Tutorial_tap_detail=Stuknij teren, aby wybrać punkt: zaznacza go pinezka, a obok pojawiają się przyciski z dalszymi działaniami.
Tutorial_go_to=Leć tam
Tutorial_go_to_detail=Ten przycisk przenosi cię lotem do stukniętego punktu; krzyżyk obok usuwa punkt.
Tutorial_gpx=Ślady GPX
Tutorial_gpx_detail=Otwórz plik GPX z opcji: Ślady GPX, a potem Wczytaj plik GPX. Ślad zostanie narysowany na terenie.
Tutorial_gpx_play=Podążaj za śladem
Tutorial_gpx_play_detail=Leć wzdłuż śladu od początku do końca; mapa podąża za nim.
Tutorial_photo_match=Dopasuj zdjęcie
Tutorial_photo_match_detail=Gdy za terenem jest zdjęcie, ten przycisk kieruje kamerę tam, gdzie patrzy zdjęcie - na podstawie linii horyzontu.
Tutorial_photo_outlines=Kontury
Tutorial_photo_outlines_detail=Jak wyraźne są kontury terenu na zdjęciu.
Tutorial_photo_terrain=Teren na zdjęciu
Tutorial_photo_terrain_detail=Stopniowo nakładaj wyrenderowany teren na zdjęcie, aż do pełnego krycia.
Tutorial_photo_nudge=Dopasuj położenie
Tutorial_photo_nudge_detail=Cztery strzałki przy krawędziach przesuwają teren nad zdjęciem o piksel na dotknięcie. Przytrzymaj jedną, by przesuwać dalej, coraz szybciej.
Tutorial_photo_pin=Przypnij punkt
Tutorial_photo_pin_detail=Stuknij dwukrotnie, aby przypiąć szczyt, a potem przeciągaj i szczypaj wokół niego. Ten przycisk lub kolejne podwójne stuknięcie go zwalnia.
Tutorial_photo_pin_adjust=Obracaj i rozciągaj
Tutorial_photo_pin_adjust_detail=Gdy szczyt jest przypięty, te same cztery przyciski obracają teren wokół punktu (lewy i prawy) oraz rozciągają lub ściskają go (górny i dolny), po trochu przy każdym dotknięciu.
Tutorial_photo_close=Zamknij zdjęcie
Tutorial_photo_close_detail=Powrót do samego terenu.
Tutorial_welcome=Witaj
Tutorial_welcome_detail=Każdy szczyt, schronisko, szlak i jezioro wokół ciebie, narysowane w 3D z pobranych danych mapy.
Tutorial_trails=Drogi i szlaki
Tutorial_trails_detail=Ścieżki są rysowane na terenie, w kolorach według rodzaju, z nazwami i numerami szlaków.
Tutorial_pistes=Trasy narciarskie i wyciągi
Tutorial_pistes_detail=Warstwa zimowa: trasy według trudności i obsługujące je wyciągi.
Tutorial_sky=Niebo, słońce i gwiazdy
Tutorial_sky_detail=Niebo odpowiada prawdziwemu położeniu słońca, księżyca i gwiazd w wybranym czasie, łącznie z gwiazdozbiorami.
Tutorial_orbit=Krąż wokół punktu
Tutorial_orbit_detail=Okrążaj stuknięty punkt, utrzymując go na środku widoku.
Tutorial_open_maps=Otwórz w aplikacji map
Tutorial_open_maps_detail=Przekaż punkt do swojej aplikacji z mapami, aby tam dojechać lub zobaczyć widok ulicy.
Tutorial_route=Trasa do punktu
Tutorial_route_detail=Dojdź tam pieszo: PeakNav wyznacza drogę po ścieżkach z pobranych danych mapy.
Tutorial_route_result=Trasa
Tutorial_route_result_detail=Otwiera się jako ślad GPX z długością, przewyższeniem i czasem przejścia - gotowy do przelotu lub udostępnienia.
Tutorial_gpx_stats=Statystyki śladu
