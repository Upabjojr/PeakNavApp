Ip_location_title=Gdzie jestem?
Ip_location_consent=Komputer nie ma GPS. PeakNav może oszacować, gdzie jesteś, na podstawie połączenia internetowego: zapytanie trafia do usługi online, która odczytuje adres, z którego pochodzi. Wynik to mniej więcej miasto, a przy VPN jest błędny. Oszacować?
Ip_location_choice=Dostęp do lokalizacji jest wyłączony dla PeakNav. Zamiast tego aplikacja może oszacować, gdzie jesteś, na podstawie połączenia internetowego: usługa online wyznacza przybliżoną pozycję z twojego adresu IP. Dokładność to mniej więcej miasto, a przy VPN wynik jest błędny. Możesz też sam wyszukać miejsce.
Ip_location_choice_no_fix=PeakNav nie znalazł Twojej pozycji: lokalizacja może być wyłączona albo nie ma tu sygnału. Zamiast tego aplikacja może oszacować, gdzie jesteś, na podstawie połączenia internetowego: usługa online wyznacza przybliżoną pozycję z Twojego adresu IP. Szacunek jest mniej więcej tak dokładny jak miasto i błędny, jeśli używasz VPN. Możesz też sam wyszukać miejsce.
