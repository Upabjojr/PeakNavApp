Provider_url_help=These placeholders use the same syntax as the OpenStreetMap editor (iD). Only add imagery you are allowed to use for mapping.\n\nWMS placeholders:\n{proj}: the projection, always EPSG:3857\n{wkid}: the same projection code without the EPSG: prefix (3857)\n{width}, {height}: the image size, always 256\n{bbox}: the tile bounds, as minX,minY,maxX,maxY\n\nTMS placeholders:\n{zoom} or {z}, {x}, {y}: the tile's zoom, column and row\n{-y} or {ty}: the row counted from the bottom (TMS)\n{switch:a,b,c}: spread requests across several host names\n{u}: Bing-style quadkey\n{@2x} or {r}: high-resolution suffix\n\nExample, as used by the OpenStreetMap editor:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
