Provider_url_help=Ови чувари места користе исту синтаксу као OpenStreetMap уређивач (iD). Додајте само снимке које смете да користите за мапирање.\n\nЧувари места за WMS:\n{proj}: пројекција, увек EPSG:3857\n{wkid}: исти код пројекције без префикса EPSG: (3857)\n{width}, {height}: величина слике, увек 256\n{bbox}: границе плочице, у облику minX,minY,maxX,maxY\n\nЧувари места за TMS:\n{zoom} или {z}, {x}, {y}: ниво увећања, колона и ред плочице\n{-y} или {ty}: ред бројан одоздо (TMS)\n{switch:a,b,c}: расподела захтева на више назива сервера\n{u}: quadkey у стилу Bing-а\n{@2x} или {r}: суфикс за високу резолуцију\n\nПример, како га користи OpenStreetMap уређивач:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
