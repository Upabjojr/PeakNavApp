Tutorial_photo_nudge_detail=Cele patru săgeți de pe margini mută terenul peste fotografie cu un pixel la fiecare atingere. Ține una apăsată ca să continue, tot mai repede.
Tutorial_photo_pin=Fixați un punct
Tutorial_photo_pin_detail=Atingeți de două ori pentru a fixa un vârf, apoi trageți și ciupiți în jurul lui. Acest buton sau o nouă atingere dublă îl eliberează.
Tutorial_photo_pin_adjust=Rotește și întinde
Tutorial_photo_pin_adjust_detail=Cu un vârf fixat, aceleași patru butoane rotesc terenul în jurul punctului (stânga și dreapta) și îl întind sau îl strâng (sus și jos), puțin la fiecare atingere.
