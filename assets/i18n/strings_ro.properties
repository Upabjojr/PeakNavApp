Ip_location_title=Unde sunt?
Ip_location_consent=Un computer nu are GPS. PeakNav poate estima unde vă aflați după conexiunea la internet: se trimite o cerere unui serviciu online, care citește adresa de la care provine. Răspunsul indică aproximativ un oraș și este greșit dacă folosiți un VPN. Estimați poziția?
Ip_location_choice=Accesul la locație este dezactivat pentru PeakNav. În schimb, poate estima unde vă aflați după conexiunea la internet: un serviciu online deduce o poziție aproximativă din adresa dvs. IP. Estimarea are precizia unui oraș și este greșită dacă folosiți un VPN. Sau puteți căuta chiar dvs. locul.
Ip_location_choice_no_fix=PeakNav nu v-a găsit poziția: localizarea poate fi dezactivată sau aici nu există semnal. În schimb, poate estima unde vă aflați din conexiunea la internet: un serviciu online deduce o poziție aproximativă din adresa dvs. IP. Estimarea este cam cât de precisă e un oraș și greșită dacă folosiți un VPN. Sau puteți căuta locul chiar dvs.
