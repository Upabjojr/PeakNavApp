Provider_url_help=Acești substituenți folosesc aceeași sintaxă ca editorul OpenStreetMap (iD). Adăugați doar imagini pe care aveți dreptul să le folosiți pentru cartografiere.\n\nSubstituenți WMS:\n{proj}: proiecția, întotdeauna EPSG:3857\n{wkid}: același cod de proiecție fără prefixul EPSG: (3857)\n{width}, {height}: dimensiunea imaginii, întotdeauna 256\n{bbox}: limitele dalei, ca minX,minY,maxX,maxY\n\nSubstituenți TMS:\n{zoom} sau {z}, {x}, {y}: nivelul de zoom, coloana și rândul dalei\n{-y} sau {ty}: rândul numărat de jos (TMS)\n{switch:a,b,c}: distribuie cererile pe mai multe nume de gazdă\n{u}: quadkey în stil Bing\n{@2x} sau {r}: sufix pentru rezoluție înaltă\n\nExemplu, așa cum îl folosește editorul OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
