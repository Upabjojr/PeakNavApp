Provider_url_help=Tieto zástupné symboly používajú rovnakú syntax ako editor OpenStreetMap (iD). Pridávajte len snímky, ktoré smiete používať na mapovanie.\n\nZástupné symboly WMS:\n{proj}: projekcia, vždy EPSG:3857\n{wkid}: rovnaký kód projekcie bez predpony EPSG: (3857)\n{width}, {height}: veľkosť obrázka, vždy 256\n{bbox}: hranice dlaždice v tvare minX,minY,maxX,maxY\n\nZástupné symboly TMS:\n{zoom} alebo {z}, {x}, {y}: priblíženie, stĺpec a riadok dlaždice\n{-y} alebo {ty}: riadok počítaný zdola (TMS)\n{switch:a,b,c}: rozloží požiadavky medzi niekoľko názvov hostiteľov\n{u}: quadkey v štýle Bing\n{@2x} alebo {r}: prípona pre vysoké rozlíšenie\n\nPríklad, ako ho používa editor OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
