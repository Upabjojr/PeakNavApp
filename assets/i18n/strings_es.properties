Provider_url_help=Estos marcadores usan la misma sintaxis que el editor de OpenStreetMap (iD). Añade solo imágenes que tengas permiso para usar en el mapeo.\n\nMarcadores WMS:\n{proj}: la proyección, siempre EPSG:3857\n{wkid}: el mismo código de proyección sin el prefijo EPSG: (3857)\n{width}, {height}: el tamaño de la imagen, siempre 256\n{bbox}: los límites del tile, como minX,minY,maxX,maxY\n\nMarcadores TMS:\n{zoom} o {z}, {x}, {y}: zoom, columna y fila del tile\n{-y} o {ty}: la fila contada desde abajo (TMS)\n{switch:a,b,c}: reparte las peticiones entre varios servidores\n{u}: quadkey estilo Bing\n{@2x} o {r}: sufijo de alta resolución\n\nEjemplo, como en el editor de OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
