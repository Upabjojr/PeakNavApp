Provider_url_help=Deze plaatshouders gebruiken dezelfde syntaxis als de OpenStreetMap-editor (iD). Voeg alleen beelden toe die je mag gebruiken om te karteren.\n\nWMS-plaatshouders:\n{proj}: de projectie, altijd EPSG:3857\n{wkid}: dezelfde projectiecode zonder het voorvoegsel EPSG: (3857)\n{width}, {height}: de beeldgrootte, altijd 256\n{bbox}: de grenzen van de tegel, als minX,minY,maxX,maxY\n\nTMS-plaatshouders:\n{zoom} of {z}, {x}, {y}: zoomniveau, kolom en rij van de tegel\n{-y} of {ty}: de rij geteld vanaf de onderkant (TMS)\n{switch:a,b,c}: verzoeken verdelen over meerdere hostnamen\n{u}: quadkey in Bing-stijl\n{@2x} of {r}: achtervoegsel voor hoge resolutie\n\nVoorbeeld, zoals gebruikt door de OpenStreetMap-editor:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
