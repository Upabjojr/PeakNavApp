Ip_location_consent=Een computer heeft geen GPS. PeakNav kan schatten waar je bent op basis van je internetverbinding: er gaat een verzoek naar een onlinedienst, die het adres leest waar het vandaan komt. Het antwoord is ongeveer een stad, en klopt niet achter een VPN. Positie schatten?
