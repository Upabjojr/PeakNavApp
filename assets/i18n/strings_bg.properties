Ip_location_consent=Компютърът няма GPS. PeakNav може да определи приблизително къде сте по интернет връзката ви: изпраща се заявка до онлайн услуга, която вижда адреса, от който идва. Отговорът е приблизително град и е грешен, ако сте зад VPN. Да се определи ли?
