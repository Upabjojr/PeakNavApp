Provider_url_help=Тези заместители използват същия синтаксис като редактора на OpenStreetMap (iD). Добавяйте само изображения, които имате право да използвате за картографиране.\n\nЗаместители за WMS:\n{proj}: проекцията, винаги EPSG:3857\n{wkid}: същият код на проекцията без префикса EPSG: (3857)\n{width}, {height}: размерът на изображението, винаги 256\n{bbox}: границите на плочката като minX,minY,maxX,maxY\n\nЗаместители за TMS:\n{zoom} или {z}, {x}, {y}: мащаб, колона и ред на плочката\n{-y} или {ty}: редът, броен отдолу (TMS)\n{switch:a,b,c}: разпределя заявките между няколко имена на хостове\n{u}: quadkey в стил Bing\n{@2x} или {r}: суфикс за висока резолюция\n\nПример, както в редактора на OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
