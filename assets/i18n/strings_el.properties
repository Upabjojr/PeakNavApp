# The "?" tutorial: one caption and one explanation per slide.
# The slide order and the keys live in tools/tutorial_screenshots.py.
Tutorial_gyroscope=Γυροσκόπιο
Tutorial_gyroscope_detail=Η προβολή ακολουθεί το τηλέφωνο καθώς το στρέφετε.
Tutorial_elevation=Υψόμετρο
Tutorial_elevation_detail=Σύρετε προς τα πάνω για να υψωθείτε πάνω από το έδαφος - από μέτρα έως χιλιόμετρα.
Tutorial_gallery=Συλλογή
Tutorial_gallery_detail=Βάλτε μια φωτογραφία σας πίσω από το ανάγλυφο.
Tutorial_camera=Κάμερα
Tutorial_camera_detail=Τραβήξτε μια φωτογραφία εδώ και δείτε τις κορυφές πάνω της.
Tutorial_search=Αναζήτηση
Tutorial_search_detail=Βρείτε μια κορυφή, ένα καταφύγιο ή μια τοποθεσία με το όνομά της.
Tutorial_options=Επιλογές
Tutorial_options_detail=Ετικέτες, εικόνες, ουρανός, ήλιος, μονάδες.
Tutorial_options_pane=Επιλογές
Tutorial_options_pane_detail=Ό,τι δείχνει η προβολή ενεργοποιείται και απενεργοποιείται εδώ.
Tutorial_satellite=Δορυφορικές εικόνες
Tutorial_satellite_detail=Μία από διάφορες πηγές εικόνων, που επιλέγεται στις επιλογές.
Tutorial_share=Κοινοποίηση
Tutorial_share_detail=Αποθηκεύστε ή κοινοποιήστε την προβολή ως εικόνα. Στα δεδομένα EXIF της διατηρείται πού τραβήχτηκε και προς τα πού κοιτάζει.
Tutorial_here=Πού είμαι
Tutorial_here_detail=Μεταβείτε στη θέση σας GPS.
Tutorial_tap=Πατήστε ένα σημείο
Tutorial_tap_detail=Πατήστε το ανάγλυφο για να επιλέξετε ένα σημείο: μια πινέζα το σημαδεύει και δίπλα του εμφανίζονται κουμπιά για περισσότερες ενέργειες.
Tutorial_go_to=Πετάξτε εκεί
Tutorial_go_to_detail=Αυτό το κουμπί σας μεταφέρει πετώντας στο σημείο που πατήσατε· ο σταυρός δίπλα του αφήνει το σημείο.
Tutorial_gpx=Ίχνη GPX
Tutorial_gpx_detail=Ανοίξτε ένα αρχείο GPX από τις επιλογές: Διαδρομές GPX, έπειτα Άνοιγμα αρχείου GPX. Το ίχνος σχεδιάζεται πάνω στο ανάγλυφο.
Tutorial_gpx_play=Ακολουθήστε ένα ίχνος
Tutorial_gpx_play_detail=Πετάξτε κατά μήκος του ίχνους από την αρχή ως το τέλος του· ο χάρτης το ακολουθεί.
Tutorial_photo_match=Αντιστοίχιση φωτογραφίας
Tutorial_photo_match_detail=Με μια φωτογραφία πίσω από το ανάγλυφο, αυτό στρέφει την κάμερα προς την κατεύθυνση της φωτογραφίας - με βάση τη γραμμή του ορίζοντα.
Tutorial_photo_outlines=Περιγράμματα
Tutorial_photo_outlines_detail=Πόσο ορατά είναι τα περιγράμματα του αναγλύφου πάνω στη φωτογραφία.
Tutorial_photo_terrain=Ανάγλυφο πάνω στη φωτογραφία
Tutorial_photo_terrain_detail=Εμφανίστε σταδιακά το αποδοσμένο ανάγλυφο πάνω στην εικόνα, έως και αδιαφανές.
Tutorial_photo_nudge=Λεπτή ρύθμιση θέσης
Tutorial_photo_nudge_detail=Τα τέσσερα βέλη στις άκρες μετακινούν το ανάγλυφο πάνω στη φωτογραφία κατά ένα pixel ανά πάτημα. Κρατήστε ένα πατημένο για να συνεχίσει, όλο και πιο γρήγορα.
Tutorial_photo_pin=Καρφίτσωμα σημείου
Tutorial_photo_pin_detail=Πατήστε δύο φορές για να καρφιτσώσετε μια κορυφή, έπειτα σύρετε και τσιμπήστε γύρω της. Αυτό το κουμπί ή ένα νέο διπλό πάτημα την απελευθερώνει.
Tutorial_photo_pin_adjust=Περιστροφή και τέντωμα
Tutorial_photo_pin_adjust_detail=Με καρφιτσωμένη κορυφή, τα ίδια τέσσερα κουμπιά περιστρέφουν το ανάγλυφο γύρω από το σημείο (αριστερά και δεξιά) και το τεντώνουν ή το συμπτύσσουν (πάνω και κάτω), λίγο ανά πάτημα.
Tutorial_photo_close=Κλείσιμο φωτογραφίας
Tutorial_photo_close_detail=Πίσω στο σκέτο ανάγλυφο.
Tutorial_welcome=Καλώς ήρθατε
Tutorial_welcome_detail=Κάθε κορυφή, καταφύγιο, μονοπάτι και λίμνη γύρω σας, σχεδιασμένα σε 3D από τα δεδομένα χάρτη που κατεβάζετε.
Tutorial_trails=Δρόμοι και μονοπάτια
Tutorial_trails_detail=Τα μονοπάτια σχεδιάζονται πάνω στο ανάγλυφο, χρωματισμένα ανά είδος, με τα ονόματα και τους αριθμούς διαδρομής τους.
Tutorial_pistes=Πίστες σκι και αναβατήρες
Tutorial_pistes_detail=Το χειμερινό επίπεδο: οι πίστες ανά δυσκολία και οι αναβατήρες που τις εξυπηρετούν.
Tutorial_sky=Ουρανός, ήλιος και αστέρια
Tutorial_sky_detail=Ο ουρανός ακολουθεί τον πραγματικό ήλιο, τη σελήνη και τα αστέρια την ώρα που επιλέγετε, μαζί με τους αστερισμούς.
Tutorial_orbit=Περιστροφή γύρω από σημείο
Tutorial_orbit_detail=Κάντε κύκλους γύρω από το σημείο που πατήσατε, κρατώντας το στο κέντρο της προβολής.
Tutorial_open_maps=Άνοιγμα σε εφαρμογή χαρτών
Tutorial_open_maps_detail=Στείλτε το σημείο στην εφαρμογή χαρτών σας, για να οδηγήσετε ως εκεί ή για προβολή δρόμου.
Tutorial_route=Διαδρομή προς σημείο
Tutorial_route_detail=Πηγαίνετε με τα πόδια: το PeakNav βρίσκει δρόμο στα μονοπάτια των δεδομένων χάρτη που κατεβάσατε.
Tutorial_route_result=Η διαδρομή
Tutorial_route_result_detail=Ανοίγει ως ίχνος GPX, με την απόσταση, την ανάβαση και τον χρόνο πεζοπορίας - έτοιμη για πτήση κατά μήκος της ή για κοινοποίηση.
Tutorial_gpx_stats=Στατιστικά ίχνους
Tutorial_gpx_stats_detail=Απόσταση, ανάβαση, χρόνος πεζοπορίας και υψομετρικό προφίλ του ίχνους. Αυτό το κουμπί μεγεθύνει το πλαίσιο.
Tutorial_gpx_share=Αποθήκευση ή κοινοποίηση ίχνους
Tutorial_gpx_share_detail=Στείλτε τη διαδρομή ή ένα ίχνος που φορτώσατε ως αρχείο GPX.
Tutorial_help=Αυτός ο οδηγός
Tutorial_help_detail=Ανοίξτε τον ξανά όποτε θέλετε, από το κουμπί «?».
Road_color_roads=Δρόμοι
Road_color_tracks=Χωματόδρομοι
Road_color_trails_easy=Πεζοπορικά μονοπάτια (T1)
Road_color_trails_mountain=Ορεινά μονοπάτια (T2–T3)
Road_color_trails_alpine=Αλπικά μονοπάτια (T4–T6)
Road_dash_length=Μήκος διακεκομμένης
Road_dash_animation=Κίνηση διακεκομμένης
Road_style_reset=Επαναφορά
Road_names=Ονόματα δρόμων/μονοπατιών
Ski_pistes=Πίστες σκι
Ski_piste_names=Ονόματα πιστών
Ski_lifts=Αναβατήρες
Ski_lift_names=Ονόματα αναβατήρων
Road_label_frequency=Συχνότητα ετικετών
Java_no_desktop=Αυτή η Java δεν μπορεί να ανοίξει παράθυρα. Εγκαταστήστε πλήρη Java ή χρησιμοποιήστε το πρόγραμμα εγκατάστασης του PeakNav.
Ip_location_title=Πού είμαι;
Ip_location_consent=Ένας υπολογιστής δεν έχει GPS. Το PeakNav μπορεί να εκτιμήσει πού βρίσκεστε από τη σύνδεσή σας στο διαδίκτυο: αποστέλλεται ένα αίτημα σε μια διαδικτυακή υπηρεσία, η οποία διαβάζει τη διεύθυνση από την οποία προέρχεται. Η απάντηση αντιστοιχεί περίπου σε μια πόλη και είναι λανθασμένη πίσω από VPN. Να γίνει εκτίμηση;
Ip_location_choice=Η πρόσβαση στην τοποθεσία είναι απενεργοποιημένη για το PeakNav. Μπορεί αντί γι' αυτό να εκτιμήσει πού βρίσκεστε από τη σύνδεσή σας στο διαδίκτυο: μια διαδικτυακή υπηρεσία υπολογίζει μια κατά προσέγγιση θέση από τη διεύθυνση IP σας. Η εκτίμηση έχει ακρίβεια περίπου πόλης και είναι λανθασμένη αν χρησιμοποιείτε VPN. Ή μπορείτε να αναζητήσετε μόνοι σας την τοποθεσία.
Ip_location_choice_no_fix=Το PeakNav δεν βρήκε τη θέση σας: η τοποθεσία μπορεί να είναι απενεργοποιημένη ή δεν υπάρχει σήμα εδώ. Μπορεί αντί γι' αυτό να εκτιμήσει πού βρίσκεστε από τη σύνδεσή σας στο διαδίκτυο: μια διαδικτυακή υπηρεσία υπολογίζει μια κατά προσέγγιση θέση από τη διεύθυνση IP σας. Η εκτίμηση έχει ακρίβεια περίπου πόλης και είναι λάθος αν χρησιμοποιείτε VPN. Ή μπορείτε να αναζητήσετε το μέρος μόνοι σας.
Position_not_found=Η θέση σας δεν βρέθηκε.
Ip_location_choice_desktop=Ένας υπολογιστής δεν έχει GPS. Το PeakNav μπορεί να εκτιμήσει πού βρίσκεστε από τη σύνδεσή σας στο διαδίκτυο: μια διαδικτυακή υπηρεσία υπολογίζει μια κατά προσέγγιση θέση από τη διεύθυνση IP σας. Η εκτίμηση έχει ακρίβεια περίπου πόλης και είναι λανθασμένη αν χρησιμοποιείτε VPN. Ή μπορείτε να αναζητήσετε μόνοι σας την τοποθεσία.
