Provider_url_help=Αυτά τα σύμβολα κράτησης θέσης χρησιμοποιούν την ίδια σύνταξη με τον επεξεργαστή του OpenStreetMap (iD). Προσθέστε μόνο εικόνες που επιτρέπεται να χρησιμοποιήσετε για χαρτογράφηση.\n\nΣύμβολα WMS:\n{proj}: η προβολή, πάντα EPSG:3857\n{wkid}: ο ίδιος κωδικός προβολής χωρίς το πρόθεμα EPSG: (3857)\n{width}, {height}: το μέγεθος της εικόνας, πάντα 256\n{bbox}: τα όρια του πλακιδίου, ως minX,minY,maxX,maxY\n\nΣύμβολα TMS:\n{zoom} ή {z}, {x}, {y}: το επίπεδο εστίασης, η στήλη και η γραμμή του πλακιδίου\n{-y} ή {ty}: η γραμμή μετρημένη από κάτω (TMS)\n{switch:a,b,c}: κατανομή των αιτημάτων σε πολλά ονόματα διακομιστών\n{u}: quadkey τύπου Bing\n{@2x} ή {r}: κατάληξη υψηλής ανάλυσης\n\nΠαράδειγμα, όπως το χρησιμοποιεί ο επεξεργαστής του OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
