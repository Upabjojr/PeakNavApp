Provider_url_help=Эти подстановки используют тот же синтаксис, что и редактор OpenStreetMap (iD). Добавляйте только те снимки, которые вам разрешено использовать для картографирования.\n\nПодстановки WMS:\n{proj}: проекция, всегда EPSG:3857\n{wkid}: тот же код проекции без префикса EPSG: (3857)\n{width}, {height}: размер изображения, всегда 256\n{bbox}: границы тайла в виде minX,minY,maxX,maxY\n\nПодстановки TMS:\n{zoom} или {z}, {x}, {y}: масштаб, столбец и строка тайла\n{-y} или {ty}: строка, отсчитанная снизу (TMS)\n{switch:a,b,c}: распределение запросов между несколькими именами хостов\n{u}: quadkey в стиле Bing\n{@2x} или {r}: суффикс высокого разрешения\n\nПример, как в редакторе OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
