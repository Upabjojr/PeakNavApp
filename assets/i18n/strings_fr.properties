Provider_url_help=Ces variables utilisent la même syntaxe que l'éditeur OpenStreetMap (iD). N'ajoutez que des images que vous êtes autorisé à utiliser pour la cartographie.\n\nVariables WMS:\n{proj}: la projection, toujours EPSG:3857\n{wkid}: le même code de projection sans le préfixe EPSG: (3857)\n{width}, {height}: la taille de l'image, toujours 256\n{bbox}: l'emprise de la tuile, sous la forme minX,minY,maxX,maxY\n\nVariables TMS:\n{zoom} ou {z}, {x}, {y}: le zoom, la colonne et la ligne de la tuile\n{-y} ou {ty}: la ligne comptée depuis le bas (TMS)\n{switch:a,b,c}: répartit les requêtes sur plusieurs serveurs\n{u}: quadkey de type Bing\n{@2x} ou {r}: suffixe haute résolution\n\nExemple, comme dans l'éditeur OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
