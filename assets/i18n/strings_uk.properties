Provider_url_help=Ці підстановки мають той самий синтаксис, що й редактор OpenStreetMap (iD). Додавайте лише ті знімки, які вам дозволено використовувати для картографування.\n\nПідстановки WMS:\n{proj}: проєкція, завжди EPSG:3857\n{wkid}: той самий код проєкції без префікса EPSG: (3857)\n{width}, {height}: розмір зображення, завжди 256\n{bbox}: межі тайла у вигляді minX,minY,maxX,maxY\n\nПідстановки TMS:\n{zoom} або {z}, {x}, {y}: масштаб, стовпець і рядок тайла\n{-y} або {ty}: рядок, відлічений знизу (TMS)\n{switch:a,b,c}: розподіл запитів між кількома іменами хостів\n{u}: quadkey у стилі Bing\n{@2x} або {r}: суфікс високої роздільності\n\nПриклад, як у редакторі OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
