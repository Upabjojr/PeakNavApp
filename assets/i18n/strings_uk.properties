Ip_location_title=Де я?
Ip_location_consent=Комп’ютер не має GPS. PeakNav може приблизно визначити, де ви, за вашим інтернет-з’єднанням: запит надсилається онлайн-сервісу, який бачить адресу, з якої він прийшов. Точність — приблизно до міста, а через VPN результат буде хибним. Визначити?
Ip_location_choice=Доступ до геолокації для PeakNav вимкнено. Натомість можна приблизно визначити, де ви, за вашим інтернет-з’єднанням: онлайн-сервіс обчислює приблизну позицію за вашою IP-адресою. Точність — приблизно до міста, а якщо ви користуєтеся VPN, результат буде хибним. Або знайдіть місце самі через пошук.
