Provider_url_help=Questi segnaposto usano la stessa sintassi dell'editor di OpenStreetMap (iD). Aggiungi solo immagini che sei autorizzato a usare per la mappatura.\n\nSegnaposto WMS:\n{proj}: la proiezione, sempre EPSG:3857\n{wkid}: lo stesso codice di proiezione senza il prefisso EPSG: (3857)\n{width}, {height}: la dimensione dell'immagine, sempre 256\n{bbox}: i limiti del tile, come minX,minY,maxX,maxY\n\nSegnaposto TMS:\n{zoom} o {z}, {x}, {y}: zoom, colonna e riga del tile\n{-y} o {ty}: la riga contata dal basso (TMS)\n{switch:a,b,c}: distribuisce le richieste su più host\n{u}: quadkey in stile Bing\n{@2x} o {r}: suffisso ad alta risoluzione\n\nEsempio, come nell'editor di OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
