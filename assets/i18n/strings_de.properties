Provider_url_help=Diese Platzhalter verwenden dieselbe Syntax wie der OpenStreetMap-Editor (iD). Füge nur Bilddaten hinzu, die du für die Kartierung verwenden darfst.\n\nWMS-Platzhalter:\n{proj}: die Projektion, immer EPSG:3857\n{wkid}: derselbe Projektionscode ohne das Präfix EPSG: (3857)\n{width}, {height}: die Bildgröße, immer 256\n{bbox}: die Kachelgrenzen als minX,minY,maxX,maxY\n\nTMS-Platzhalter:\n{zoom} oder {z}, {x}, {y}: Zoom, Spalte und Zeile der Kachel\n{-y} oder {ty}: die von unten gezählte Zeile (TMS)\n{switch:a,b,c}: verteilt Anfragen auf mehrere Server\n{u}: Quadkey im Bing-Stil\n{@2x} oder {r}: Suffix für hohe Auflösung\n\nBeispiel, wie im OpenStreetMap-Editor:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
