Ip_location_consent=Počítač nemá GPS. PeakNav může odhadnout vaši polohu podle internetového připojení: požadavek se odešle online službě, která přečte adresu, ze které přichází. Výsledkem je přibližně město a za VPN je chybný. Odhadnout?
