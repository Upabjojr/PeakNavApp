Provider_url_help=Tyto zástupné symboly používají stejnou syntaxi jako editor OpenStreetMap (iD). Přidávejte jen snímky, které smíte používat k mapování.\n\nZástupné symboly WMS:\n{proj}: projekce, vždy EPSG:3857\n{wkid}: stejný kód projekce bez předpony EPSG: (3857)\n{width}, {height}: velikost obrázku, vždy 256\n{bbox}: hranice dlaždice ve tvaru minX,minY,maxX,maxY\n\nZástupné symboly TMS:\n{zoom} nebo {z}, {x}, {y}: přiblížení, sloupec a řádek dlaždice\n{-y} nebo {ty}: řádek počítaný zdola (TMS)\n{switch:a,b,c}: rozloží požadavky mezi několik názvů hostitelů\n{u}: quadkey ve stylu Bing\n{@2x} nebo {r}: přípona pro vysoké rozlišení\n\nPříklad, jak jej používá editor OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
