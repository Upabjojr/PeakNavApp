Ip_location_title=Var är jag?
Ip_location_consent=En dator har ingen GPS. PeakNav kan uppskatta var du är utifrån din internetanslutning: en förfrågan skickas till en onlinetjänst, som läser adressen den kommer från. Svaret motsvarar ungefär en stad, och blir fel bakom en VPN. Uppskatta positionen?
Ip_location_choice=Platsåtkomst är avstängd för PeakNav. Appen kan i stället uppskatta var du är utifrån din internetanslutning: en onlinetjänst räknar fram en ungefärlig position från din IP-adress. Uppskattningen är ungefär lika exakt som en stad, och blir fel om du använder en VPN. Eller så kan du söka upp platsen själv.
Ip_location_choice_no_fix=PeakNav kunde inte hitta din position: platstjänster kan vara avstängda, eller så finns det ingen signal här. Appen kan i stället uppskatta var du är utifrån din internetanslutning: en onlinetjänst räknar ut en ungefärlig position från din IP-adress. Uppskattningen är ungefär lika exakt som en stad, och fel om du använder VPN. Eller så kan du söka efter platsen själv.
