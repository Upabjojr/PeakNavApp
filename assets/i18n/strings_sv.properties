Provider_url_help=Dessa platshållare använder samma syntax som OpenStreetMap-redigeraren (iD). Lägg bara till bilder som du har tillåtelse att använda för kartläggning.\n\nWMS-platshållare:\n{proj}: projektionen, alltid EPSG:3857\n{wkid}: samma projektionskod utan prefixet EPSG: (3857)\n{width}, {height}: bildstorleken, alltid 256\n{bbox}: rutans gränser, som minX,minY,maxX,maxY\n\nTMS-platshållare:\n{zoom} eller {z}, {x}, {y}: rutans zoomnivå, kolumn och rad\n{-y} eller {ty}: raden räknad nerifrån (TMS)\n{switch:a,b,c}: fördelar förfrågningar över flera värdnamn\n{u}: quadkey i Bing-stil\n{@2x} eller {r}: suffix för hög upplösning\n\nExempel, som i OpenStreetMap-redigeraren:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
