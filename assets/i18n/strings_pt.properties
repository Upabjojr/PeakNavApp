Provider_url_help=Estes marcadores usam a mesma sintaxe do editor do OpenStreetMap (iD). Adicione apenas imagens que você tem permissão para usar no mapeamento.\n\nMarcadores WMS:\n{proj}: a projeção, sempre EPSG:3857\n{wkid}: o mesmo código de projeção sem o prefixo EPSG: (3857)\n{width}, {height}: o tamanho da imagem, sempre 256\n{bbox}: os limites do tile, como minX,minY,maxX,maxY\n\nMarcadores TMS:\n{zoom} ou {z}, {x}, {y}: zoom, coluna e linha do tile\n{-y} ou {ty}: a linha contada de baixo (TMS)\n{switch:a,b,c}: distribui as requisições por vários servidores\n{u}: quadkey no estilo Bing\n{@2x} ou {r}: sufixo de alta resolução\n\nExemplo, como no editor do OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
