Provider_url_help=Ovi zamjenski izrazi koriste istu sintaksu kao uređivač OpenStreetMapa (iD). Dodajte samo snimke koje smijete koristiti za kartiranje.\n\nZamjenski izrazi za WMS:\n{proj}: projekcija, uvijek EPSG:3857\n{wkid}: isti kôd projekcije bez prefiksa EPSG: (3857)\n{width}, {height}: veličina slike, uvijek 256\n{bbox}: granice pločice, u obliku minX,minY,maxX,maxY\n\nZamjenski izrazi za TMS:\n{zoom} ili {z}, {x}, {y}: razina povećanja, stupac i redak pločice\n{-y} ili {ty}: redak brojen odozdo (TMS)\n{switch:a,b,c}: raspodjela zahtjeva na više naziva poslužitelja\n{u}: quadkey u stilu Binga\n{@2x} ili {r}: sufiks za visoku razlučivost\n\nPrimjer, kako ga koristi uređivač OpenStreetMapa:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
