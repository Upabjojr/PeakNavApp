Ip_location_title=Gdje sam?
Ip_location_consent=Računalo nema GPS. PeakNav može procijeniti gdje se nalazite na temelju internetske veze: zahtjev se šalje mrežnoj usluzi, koja očitava adresu s koje dolazi. Odgovor je otprilike grad i pogrešan je ako koristite VPN. Procijeniti položaj?
Ip_location_choice=Pristup lokaciji za PeakNav je isključen. Umjesto toga može procijeniti gdje se nalazite na temelju internetske veze: mrežna usluga određuje približan položaj iz vaše IP adrese. Procjena je točna otprilike do razine grada i pogrešna ako koristite VPN. Mjesto možete potražiti i sami.
Ip_location_choice_desktop=Računalo nema GPS. PeakNav može procijeniti gdje se nalazite na temelju internetske veze: mrežna usluga određuje približan položaj iz vaše IP adrese. Procjena je točna otprilike do razine grada i pogrešna ako koristite VPN. Mjesto možete potražiti i sami.
