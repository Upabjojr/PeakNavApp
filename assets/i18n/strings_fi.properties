Provider_url_help=Nämä paikkamerkit käyttävät samaa syntaksia kuin OpenStreetMap-editori (iD). Lisää vain kuvia, joita saat käyttää kartoitukseen.\n\nWMS-paikkamerkit:\n{proj}: projektio, aina EPSG:3857\n{wkid}: sama projektiokoodi ilman EPSG:-etuliitettä (3857)\n{width}, {height}: kuvan koko, aina 256\n{bbox}: laatan rajat muodossa minX,minY,maxX,maxY\n\nTMS-paikkamerkit:\n{zoom} tai {z}, {x}, {y}: laatan zoomaustaso, sarake ja rivi\n{-y} tai {ty}: rivi alhaalta laskettuna (TMS)\n{switch:a,b,c}: jakaa pyynnöt usealle palvelinnimelle\n{u}: Bing-tyylinen quadkey\n{@2x} tai {r}: korkean resoluution pääte\n\nEsimerkki OpenStreetMap-editorin käyttämästä muodosta:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
