Ip_location_consent=Računalnik nima GPS. PeakNav lahko vaš položaj oceni iz internetne povezave: spletni storitvi pošlje zahtevo, storitev pa prebere naslov, s katerega prihaja. Odgovor je približno mesto in je napačen, če uporabljate VPN. Želite oceno?
