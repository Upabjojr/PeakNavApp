Provider_url_help=Te oznake uporabljajo enako sintakso kot urejevalnik OpenStreetMap (iD). Dodajte le posnetke, ki jih smete uporabljati za kartiranje.\n\nOznake WMS:\n{proj}: projekcija, vedno EPSG:3857\n{wkid}: ista koda projekcije brez predpone EPSG: (3857)\n{width}, {height}: velikost slike, vedno 256\n{bbox}: meje ploščice v obliki minX,minY,maxX,maxY\n\nOznake TMS:\n{zoom} ali {z}, {x}, {y}: povečava, stolpec in vrstica ploščice\n{-y} ali {ty}: vrstica, šteta od spodaj (TMS)\n{switch:a,b,c}: porazdeli zahteve med več imen gostiteljev\n{u}: quadkey v slogu Bing\n{@2x} ali {r}: pripona za visoko ločljivost\n\nPrimer, kot ga uporablja urejevalnik OpenStreetMap:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
