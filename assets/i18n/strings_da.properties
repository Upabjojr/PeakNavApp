Ip_location_title=Hvor er jeg?
Ip_location_consent=En computer har ingen GPS. PeakNav kan anslå, hvor du er, ud fra din internetforbindelse: en forespørgsel sendes til en onlinetjeneste, som læser adressen, den kommer fra. Svaret svarer nogenlunde til en by og er forkert bag en VPN. Anslå positionen?
