Provider_url_help=Disse pladsholdere bruger samme syntaks som OpenStreetMap-editoren (iD). Tilføj kun billeder, som du har lov til at bruge til kortlægning.\n\nWMS-pladsholdere:\n{proj}: projektionen, altid EPSG:3857\n{wkid}: samme projektionskode uden præfikset EPSG: (3857)\n{width}, {height}: billedstørrelsen, altid 256\n{bbox}: flisens grænser, som minX,minY,maxX,maxY\n\nTMS-pladsholdere:\n{zoom} eller {z}, {x}, {y}: flisens zoomniveau, kolonne og række\n{-y} eller {ty}: rækken talt nedefra (TMS)\n{switch:a,b,c}: fordeler forespørgsler på flere værtsnavne\n{u}: quadkey i Bing-stil\n{@2x} eller {r}: suffiks for høj opløsning\n\nEksempel, som i OpenStreetMap-editoren:\nhttps://tile.openstreetmap.org/{zoom}/{x}/{y}.png
