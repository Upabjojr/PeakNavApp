# Draft of the F-Droid packaging recipe for PeakNav, in the format of the fdroiddata repository
# (https://gitlab.com/fdroid/fdroiddata, file metadata/com.peaknav.fdroid.yml). Kept here so it can be
# tried with fdroidserver before being submitted; the copy that counts is the one merged into
# fdroiddata. See README.md in this folder for the steps and the placeholders.
#
# Name, summary, description, icon and screenshots are not set here: F-Droid reads them from
# fastlane/metadata/android/ in this repository, at the commit it builds.

Categories:
  - Navigation
  - Science & Education
License: GPL-3.0-only
AuthorName: Francesco Bonazzi
AuthorEmail: peaknav.info@gmail.com
WebSite: https://peaknav.com
SourceCode: https://github.com/Upabjojr/PeakNavApp
IssueTracker: https://github.com/Upabjojr/PeakNavApp/issues
Changelog: https://github.com/Upabjojr/PeakNavApp/releases

AutoName: PeakNav

# The name "PeakNav", the logo and the launcher icon are the author's, all rights reserved
# (LICENSE, TRADEMARK-AND-ASSETS.md); the code and every other asset are GPL-3.0.
AntiFeatures:
  NonFreeAssets:
    en-US: The logo and launcher icon artwork are all rights reserved; the code and every other asset are GPL-3.0.

RepoType: git
Repo: https://github.com/Upabjojr/PeakNavApp.git

Builds:
  # Replace the placeholders with the first release tag that contains the F-Droid build changes;
  # android/build.gradle at that tag must carry exactly this versionCode and versionName.
  - versionName: X.Y.Z
    versionCode: NNN
    commit: X.Y.Z
    subdir: android
    gradle:
      - yes
    # A package id of its own, com.peaknav.fdroid: F-Droid signs with its own key, and the id
    # lets its build be installed beside the Google Play one (android/build.gradle reads it).
    gradleprops:
      - peaknavApplicationId=com.peaknav.fdroid
    # Only the Android app is built. settings.gradle includes a module only when its directory
    # exists, so the other targets (construo, RoboVM, the headless renderer) are simply removed.
    rm:
      - desktop
      - headless
      - ios
      - peaknav-python
      - snapshots
    # The photo-skyline classifier's decision forests: model data (threshold comparisons read by
    # com.peaknav.skyline.SkyClassifier), not executable code, trained from the app's own feature
    # code by tools/skyline_train.py. The scanner flags any .bin file, hence the exception.
    scanignore:
      - core/src/main/resources/com/peaknav/skyline/boundary_model.bin
      - core/src/main/resources/com/peaknav/skyline/sky_model.bin

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: X.Y.Z
CurrentVersionCode: NNN
